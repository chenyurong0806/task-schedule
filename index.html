<!DOCTYPE html>
<html lang="zh-CN" class="transition-colors duration-300">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>暑假作业看板</title>
    <meta name="theme-color" content="#6750A4">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        }
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />
    <link rel="icon" type="image/png" href="icon.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --md-sys-color-primary: #6750A4;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-primary-container: #EADDFF;
            --md-sys-color-on-primary-container: #21005D;
            --md-sys-color-secondary: #625B71;
            --md-sys-color-on-secondary: #FFFFFF;
            --md-sys-color-secondary-container: #E8DEF8;
            --md-sys-color-on-secondary-container: #1D192B;
            --md-sys-color-background: #FEF7FF;
            --md-sys-color-on-background: #1D1B20;
            --md-sys-color-surface: #FEF7FF;
            --md-sys-color-on-surface: #1D1B20;
            --md-sys-color-surface-variant: #E7E0EC;
            --md-sys-color-on-surface-variant: #49454F;
            --md-sys-color-surface-container-lowest: #FFFFFF;
            --md-sys-color-surface-container-low: #F7F2FA;
            --md-sys-color-surface-container: #F3EDF7;
            --md-sys-color-surface-container-high: #ECE6F0;
            --md-sys-color-surface-container-highest: #E6E1E5;
            --md-sys-color-outline: #79747E;
            --md-sys-color-outline-variant: #CAC4D0;
            --md-sys-color-tertiary-container: #FFD8E4;
            --md-sys-color-gold: #F59E0B;
            --md-motion-easing-emphasized: cubic-bezier(0.2, 0, 0, 1);
            --md-motion-easing-standard: cubic-bezier(0.4, 0, 0.2, 1);
            --md-motion-duration-short4: 200ms;
            --md-motion-duration-medium1: 250ms;
            --md-motion-duration-long1: 400ms;
        }

        html.dark {
            --md-sys-color-primary: #D0BCFF;
            --md-sys-color-on-primary: #381E72;
            --md-sys-color-primary-container: #4F378B;
            --md-sys-color-on-primary-container: #EADDFF;
            --md-sys-color-secondary: #CCC2DC;
            --md-sys-color-on-secondary: #332D41;
            --md-sys-color-secondary-container: #4A4458;
            --md-sys-color-on-secondary-container: #E8DEF8;
            --md-sys-color-background: #141218;
            --md-sys-color-on-background: #E6E1E5;
            --md-sys-color-surface: #141218;
            --md-sys-color-on-surface: #E6E1E5;
            --md-sys-color-surface-variant: #49454F;
            --md-sys-color-on-surface-variant: #CAC4D0;
            --md-sys-color-surface-container-lowest: #0F0D13;
            --md-sys-color-surface-container-low: #1D1B20;
            --md-sys-color-surface-container: #211F26;
            --md-sys-color-surface-container-high: #2B2930;
            --md-sys-color-surface-container-highest: #333138;
            --md-sys-color-outline: #938F99;
            --md-sys-color-outline-variant: #49454F;
            --md-sys-color-gold: #FBBF24;
        }

        body {
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-background);
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        .material-symbols-outlined.star-filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            color: var(--md-sys-color-gold);
        }

        .material-symbols-outlined.star-outline {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            color: var(--md-sys-color-outline);
        }

        @keyframes starPopAnim {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.4) rotate(15deg);
            }

            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        .star-pop {
            animation: starPopAnim 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .md-nav-item .md-icon-wrapper {
            transition: background-color var(--md-motion-duration-short4) var(--md-motion-easing-emphasized);
        }

        .md-nav-item.active .md-icon-wrapper {
            background-color: var(--md-sys-color-secondary-container);
            color: var(--md-sys-color-on-secondary-container);
            border-radius: 16px;
        }

        .md-ripple {
            position: relative;
            overflow: hidden;
        }

        .md-ripple::after {
            content: "";
            position: absolute;
            inset: 0;
            background-color: currentColor;
            opacity: 0;
            transition: opacity var(--md-motion-duration-short4) linear;
        }

        .md-ripple:hover::after {
            opacity: 0.08;
        }

        .md-ripple:active::after {
            opacity: 0.16;
        }

        #task-drawer {
            transition: transform var(--md-motion-duration-long1) var(--md-motion-easing-emphasized),
                width var(--md-motion-duration-long1) var(--md-motion-easing-emphasized),
                opacity var(--md-motion-duration-medium1);
        }

        #task-drawer.collapsed {
            width: 0px;
            opacity: 0;
            pointer-events: none;
            transform: translateX(-100%);
        }

        @media (min-width: 768px) {
            #task-drawer.collapsed {
                transform: none;
            }
        }

        .view-pane {
            opacity: 0;
            transform: translateY(12px);
            transition: opacity var(--md-motion-duration-long1) var(--md-motion-easing-emphasized),
                transform var(--md-motion-duration-long1) var(--md-motion-easing-emphasized);
            pointer-events: none;
            position: absolute;
            inset: 0;
        }

        .view-pane.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
            position: relative;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
        }

        .no-scrollbar::-webkit-scrollbar,
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar,
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .md-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .md-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .md-scrollbar::-webkit-scrollbar-thumb {
            background: var(--md-sys-color-outline-variant);
            border-radius: 8px;
        }

        .md-scrollbar::-webkit-scrollbar-thumb:hover {
            background: var(--md-sys-color-outline);
        }

        .md-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: var(--md-sys-color-outline-variant) transparent;
        }

        .chip-active {
            background-color: var(--md-sys-color-secondary-container) !important;
            color: var(--md-sys-color-on-secondary-container) !important;
            border-color: transparent !important;
        }

        .drag-hover {
            background-color: var(--md-sys-color-primary-container) !important;
            opacity: 0.85;
            transform: scale(1.02);
            box-shadow: 0 0 0 2px var(--md-sys-color-primary) inset;
            border-radius: 8px;
        }

        .meta-drop-hover {
            background-color: var(--md-sys-color-tertiary-container) !important;
            transform: scale(1.02);
            border: 1px dashed var(--md-sys-color-primary) !important;
            z-index: 10;
            position: relative;
        }

        .timeline-track-container {
            position: relative;
            height: 1440px;
        }

        .timeline-hour-row {
            height: 60px;
            border-bottom: 1px dashed var(--md-sys-color-outline-variant);
            position: relative;
        }

        .resize-handle {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 12px;
            cursor: ns-resize;
            background-color: rgba(0, 0, 0, 0.12);
            border-radius: 0 0 8px 8px;
            touch-action: none;
        }

        .resize-handle:hover {
            background-color: rgba(0, 0, 0, 0.3);
        }

        #global-tooltip {
            position: fixed;
            pointer-events: none;
            z-index: 200;
            display: none;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.15);
            background-color: var(--md-sys-color-surface-container-highest);
            color: var(--md-sys-color-on-surface);
            border-radius: 8px;
            padding: 12px;
            max-width: 280px;
            border: 1px solid var(--md-sys-color-outline-variant);
        }

        .folder-content {
            transition: grid-template-rows var(--md-motion-duration-long1) var(--md-motion-easing-standard);
            display: grid;
            grid-template-rows: 0fr;
        }

        .folder-content.open {
            grid-template-rows: 1fr;
        }

        .folder-inner {
            overflow: hidden;
            min-height: 0;
            padding: 0 !important;
            border: none !important;
        }

        .folder-icon {
            transition: transform var(--md-motion-duration-short4) var(--md-motion-easing-standard);
            transform: rotate(0deg);
        }

        .folder-icon.open {
            transform: rotate(90deg);
        }

        @keyframes locatePulse {
            0% {
                box-shadow: 0 0 0 0 rgba(103, 80, 164, 0.8);
            }

            40% {
                box-shadow: 0 0 0 3px rgba(103, 80, 164, 0.5);
            }

            70% {
                box-shadow: 0 0 0 6px rgba(103, 80, 164, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(103, 80, 164, 0);
            }
        }

        .locate-highlight {
            animation: locatePulse 1s ease-in-out 2;
        }

        .slider-track {
            display: flex;
            width: 300%;
            height: 100%;
            transform: translateX(-33.3333%);
            will-change: transform;
        }

        .slider-pane {
            width: 33.3333%;
            height: 100%;
            flex-shrink: 0;
        }

        .starred-calendar-item {
            border: 1.5px solid var(--md-sys-color-gold) !important;
            box-shadow: 0 0 6px rgba(245, 158, 11, 0.4);
        }
    </style>
</head>

<body class="h-[100dvh] w-screen flex flex-col md:flex-row select-none overflow-hidden">

    <div id="global-tooltip" class="text-xs flex flex-col gap-1"></div>

    <div id="custom-context-menu"
        class="fixed hidden z-[100] rounded-xl p-1 shadow-xl border text-xs min-w-[150px] bg-[var(--md-sys-color-surface-container-high)] border-[var(--md-sys-color-outline-variant)]">
    </div>

    <div id="date-quick-menu"
        class="fixed hidden z-[110] rounded-xl p-1 shadow-xl border text-xs min-w-[140px] flex-col gap-0.5 bg-[var(--md-sys-color-surface-container-high)] border-[var(--md-sys-color-outline-variant)]">
        <button onclick="executeDateAction('today')"
            class="w-full text-left px-3 py-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/5 text-[var(--md-sys-color-on-surface)] flex items-center gap-2 font-medium transition-colors">
            <span class="material-symbols-outlined text-sm text-[var(--md-sys-color-primary)]">today</span>今日完成
        </button>
        <button onclick="executeDateAction('custom')"
            class="w-full text-left px-3 py-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/5 text-[var(--md-sys-color-on-surface)] flex items-center gap-2 font-medium transition-colors">
            <span
                class="material-symbols-outlined text-sm text-[var(--md-sys-color-secondary)]">edit_calendar</span>更改日期
        </button>
    </div>

    <div id="md3-datepicker-modal"
        class="fixed hidden z-[130] w-[280px] sm:w-[300px] rounded-[24px] p-4 shadow-2xl flex-col gap-3 bg-[var(--md-sys-color-surface-container-high)] text-[var(--md-sys-color-on-surface)] border border-[var(--md-sys-color-outline-variant)] transition-all duration-150 transform scale-95 opacity-0">
        <div class="flex flex-col gap-0.5 px-1">
            <span class="text-[10px] font-bold tracking-wider uppercase text-[var(--md-sys-color-primary)]">选择日期</span>
            <h3 class="text-base font-black text-[var(--md-sys-color-on-surface)]" id="md3-picker-header-date">
                2026年8月17日</h3>
        </div>
        <div class="flex justify-between items-center px-1">
            <span class="text-xs font-bold text-[var(--md-sys-color-on-surface-variant)]"
                id="md3-picker-month-year">2026年 8月</span>
            <div class="flex items-center gap-1">
                <button type="button" onclick="navigateMD3PickerMonth(-1)"
                    class="p-1 rounded-full hover:bg-black/10 dark:hover:bg-white/10 text-[var(--md-sys-color-on-surface)] flex items-center justify-center">
                    <span class="material-symbols-outlined text-base">chevron_left</span>
                </button>
                <button type="button" onclick="navigateMD3PickerMonth(1)"
                    class="p-1 rounded-full hover:bg-black/10 dark:hover:bg-white/10 text-[var(--md-sys-color-on-surface)] flex items-center justify-center">
                    <span class="material-symbols-outlined text-base">chevron_right</span>
                </button>
            </div>
        </div>
        <div class="grid grid-cols-7 gap-1 text-center text-xs font-bold text-[var(--md-sys-color-on-surface-variant)]">
            <div>日</div>
            <div>一</div>
            <div>二</div>
            <div>三</div>
            <div>四</div>
            <div>五</div>
            <div>六</div>
        </div>
        <div id="md3-picker-days-grid" class="grid grid-cols-7 gap-1 text-center text-xs min-h-[160px]"></div>
        <div class="flex justify-end gap-2 pt-2 border-t border-[var(--md-sys-color-outline-variant)]">
            <button type="button" onclick="closeMD3DatePicker()"
                class="px-3 py-1.5 rounded-full text-xs font-bold hover:bg-black/5 dark:hover:bg-white/5 text-[var(--md-sys-color-primary)] transition-colors">取消</button>
            <button type="button" onclick="confirmMD3DatePicker()"
                class="px-4 py-1.5 rounded-full text-xs font-bold text-[var(--md-sys-color-on-primary)] shadow-sm bg-[var(--md-sys-color-primary)] hover:brightness-110 active:scale-95 transition-all">确定</button>
        </div>
    </div>

    <aside
        class="w-full md:w-20 h-16 md:h-full flex flex-row md:flex-col justify-around md:justify-between items-center py-2 md:py-6 flex-shrink-0 order-last md:order-first border-t md:border-t-0 md:border-r z-50 bg-[var(--md-sys-color-surface-container-low)] border-[var(--md-sys-color-outline-variant)] overflow-x-auto no-scrollbar">
        <div class="flex flex-row md:flex-col items-center gap-2 md:gap-5 px-4 md:px-0 w-full md:w-auto">
            <div
                class="hidden md:flex w-12 h-12 rounded-full items-center justify-center text-[var(--md-sys-color-primary)]">
                <span class="material-symbols-outlined text-[32px] font-bold">spellcheck</span>
            </div>
            <nav class="flex flex-row md:flex-col gap-2 md:gap-4 flex-1 md:w-full md:px-2">
                <button onclick="switchView('home')" id="nav-home"
                    class="md-nav-item active flex flex-col items-center gap-1 group md:w-full text-center outline-none px-3 md:px-0">
                    <div class="md-icon-wrapper w-14 h-8 flex items-center justify-center rounded-full"><span
                            class="material-symbols-outlined">home</span></div>
                    <span class="text-[10px] md:text-xs font-medium tracking-wider">首页</span>
                </button>
                <button onclick="switchView('today')" id="nav-today"
                    class="md-nav-item flex flex-col items-center gap-1 group md:w-full text-center outline-none px-3 md:px-0">
                    <div class="md-icon-wrapper w-14 h-8 flex items-center justify-center rounded-full"><span
                            class="material-symbols-outlined">today</span></div>
                    <span class="text-[10px] md:text-xs font-medium tracking-wider">今日</span>
                </button>
                <button onclick="switchView('calendar')" id="nav-calendar"
                    class="md-nav-item flex flex-col items-center gap-1 group md:w-full text-center outline-none px-3 md:px-0">
                    <div class="md-icon-wrapper w-14 h-8 flex items-center justify-center rounded-full"><span
                            class="material-symbols-outlined">calendar_month</span></div>
                    <span class="text-[10px] md:text-xs font-medium tracking-wider">日程</span>
                </button>
            </nav>
            <hr class="hidden md:block w-8 border-[var(--md-sys-color-outline-variant)]">
            <div class="flex flex-row md:flex-col gap-1 md:gap-3">
                <button onclick="toggleDarkMode(true)"
                    class="w-10 h-10 rounded-full flex items-center justify-center md-ripple text-[var(--md-sys-color-on-surface-variant)]"
                    title="切换深色模式">
                    <span class="material-symbols-outlined" id="dark-mode-icon">dark_mode</span>
                </button>
                <button onclick="triggerDataExport()"
                    class="hidden md:flex w-10 h-10 rounded-full items-center justify-center md-ripple text-[var(--md-sys-color-on-surface-variant)]"
                    title="导出配置">
                    <span class="material-symbols-outlined">download</span>
                </button>
                <button onclick="document.getElementById('import-file-input').click()"
                    class="hidden md:flex w-10 h-10 rounded-full items-center justify-center md-ripple text-[var(--md-sys-color-on-surface-variant)]"
                    title="导入配置">
                    <span class="material-symbols-outlined">upload</span>
                </button>
                <input type="file" id="import-file-input" class="hidden" accept=".json"
                    onchange="triggerDataImport(event)">
            </div>
        </div>
        <button onclick="openAddTaskModal()"
            class="md-ripple w-12 h-12 md:w-14 md:h-14 rounded-xl md:rounded-2xl flex items-center justify-center shadow-lg transition-transform active:scale-95 flex-shrink-0 mr-4 md:mr-0"
            style="background-color: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container);">
            <span class="material-symbols-outlined text-[24px] md:text-[28px]">add</span>
        </button>
    </aside>

    <section id="task-drawer"
        class="absolute md:relative z-40 h-[calc(100%-4rem)] md:h-full w-80 max-w-[85vw] flex flex-col border-r flex-shrink-0 transition-all duration-300 shadow-2xl md:shadow-none"
        style="background-color: var(--md-sys-color-surface-container-lowest); border-color: var(--md-sys-color-outline-variant);"
        ondragover="allowDrop(event)" ondragleave="handleDragLeave(event)">

        <div class="p-4 flex flex-col gap-3 border-b flex-shrink-0 max-w-full overflow-hidden"
            style="border-color: var(--md-sys-color-outline-variant);">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-semibold tracking-wide" style="color: var(--md-sys-color-on-surface-variant);">
                    索引</h2>
                <button onclick="toggleDrawer()"
                    class="w-8 h-8 rounded-full flex items-center justify-center md-ripple hover:bg-black/5 dark:hover:bg-white/5">
                    <span class="material-symbols-outlined text-xl">menu_open</span>
                </button>
            </div>

            <div class="relative w-full">
                <div
                    class="flex items-center bg-[var(--md-sys-color-surface-container-high)] rounded-full px-3 py-1.5 border border-[var(--md-sys-color-outline-variant)] focus-within:border-[var(--md-sys-color-primary)] transition-colors">
                    <span
                        class="material-symbols-outlined text-[16px] text-[var(--md-sys-color-on-surface-variant)]">search</span>
                    <input type="text" id="drawer-search-input" oninput="handleDrawerSearch(this.value)"
                        placeholder="搜索关键词（例如：数学 函数）"
                        class="bg-transparent flex-1 outline-none text-xs ml-2 text-[var(--md-sys-color-on-surface)]" />
                    <span id="drawer-search-count"
                        class="text-[10px] text-[var(--md-sys-color-primary)] font-bold ml-2"></span>
                </div>
                <div id="drawer-search-results"
                    class="absolute left-0 right-0 top-full mt-2 bg-[var(--md-sys-color-surface-container-highest)] border border-[var(--md-sys-color-outline-variant)] rounded-xl shadow-lg z-[60] hidden flex-col max-h-48 overflow-y-auto md-scrollbar">
                </div>
            </div>

            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1 pr-1 w-full flex-nowrap"
                id="drawer-filter-chips">
                <button onclick="changeDrawerArrange('starred')" id="chip-starred"
                    class="chip-active text-[11px] py-1.5 px-3 rounded-full text-center font-semibold md-ripple border border-[var(--md-sys-color-outline-variant)] bg-transparent whitespace-nowrap flex-shrink-0">重要</button>
                <button onclick="changeDrawerArrange('subject')" id="chip-subject"
                    class="text-[11px] py-1.5 px-3 rounded-full text-center font-semibold md-ripple border border-[var(--md-sys-color-outline-variant)] bg-transparent whitespace-nowrap flex-shrink-0">按学科</button>
                <button onclick="changeDrawerArrange('tag')" id="chip-tag"
                    class="text-[11px] py-1.5 px-3 rounded-full text-center font-semibold md-ripple border border-[var(--md-sys-color-outline-variant)] bg-transparent whitespace-nowrap flex-shrink-0">按标签</button>
                <button onclick="changeDrawerArrange('time')" id="chip-time"
                    class="text-[11px] py-1.5 px-3 rounded-full text-center font-semibold md-ripple border border-[var(--md-sys-color-outline-variant)] bg-transparent whitespace-nowrap flex-shrink-0">按时间</button>
            </div>

            <div id="drawer-quick-add-container" class="gap-1 mt-1 flex items-center" style="display: none;">
                <input type="color" id="drawer-quick-color" value="#6750A4"
                    class="w-6 h-6 p-0 border-0 rounded cursor-pointer hidden flex-shrink-0 bg-transparent" />
                <input type="text" id="drawer-quick-input" placeholder="创建一项..."
                    class="flex-1 text-xs px-2 py-1.5 rounded-lg border outline-none bg-[var(--md-sys-color-surface-container-low)] border-[var(--md-sys-color-outline-variant)] text-[var(--md-sys-color-on-surface)] min-w-0" />
                <button onclick="executeQuickMetaAdd()"
                    class="px-2 py-1.5 rounded-lg text-xs font-bold bg-[var(--md-sys-color-primary-container)] text-[var(--md-sys-color-on-primary-container)] md-ripple transition-transform active:scale-95 flex-shrink-0">+</button>
            </div>
        </div>
        <div class="flex-1 overflow-hidden relative flex flex-col">
            <div id="drawer-task-container" class="flex-1 overflow-y-auto p-2 flex flex-col gap-1 md-scrollbar"></div>
            <div id="drawer-today-locator-container"
                class="p-2 border-t border-[var(--md-sys-color-outline-variant)] bg-[var(--md-sys-color-surface-container-lowest)] hidden flex-shrink-0 justify-center">
                <button onclick="locateDrawerToday()"

    <script>
        const getRealTodayStr = () => {
            const d = new Date();
            d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
            return d.toISOString().split('T')[0];
        };
        const TODAY_STR = getRealTodayStr();

        const defaultInitialState = {
            batches: [{
                id: "batch-demo-01", title: "高一物理必修第一册错题回溯", content: "对期末考卷中动力学多体滑块模型与牛顿第二定律综合题重新推导。", subject: "物理", tags: ["高难度", "急需突破"],
                subtasks: [{ id: "sub-101", text: "滑块模型核心三题拆解", weight: 1, done: true, starred: true, completedAt: TODAY_STR, endDate: TODAY_STR, startMinute: 480, durationMinutes: 90 },
                { id: "sub-102", text: "建立隔离法受力方程组", weight: 1, done: false, starred: false, endDate: TODAY_STR, startMinute: 540, durationMinutes: 120 }]
            }, {
                id: "batch-demo-02", title: "英语3500词高效循环背诵", content: "复习并默写核心变形词及短语。", subject: "英语", tags: ["高频高燃"],
                subtasks: [{ id: "sub-201", text: "Unit 1 核心词默写", weight: 1, done: true, starred: false, completedAt: TODAY_STR, endDate: TODAY_STR, startMinute: 780, durationMinutes: 180 },
                { id: "sub-202", text: "Unit 2 完形填空精讲", weight: 1, done: false, starred: true, endDate: null, startMinute: null, durationMinutes: 120 }]
            }],
            tags: [{ name: "高难度", color: "#E53935" }, { name: "急需突破", color: "#FB8C00" }, { name: "高频高燃", color: "#3949AB" }],
            subjects: ["语文", "数学", "英语", "物理", "化学", "地理"],
            currentDrawerArrange: "starred", searchQuery: "", selectedFormSubject: "数学", selectedFormTags: [],
            calendarYear: parseInt(TODAY_STR.split('-')[0]), calendarMonth: parseInt(TODAY_STR.split('-')[1]), calendarMode: "month", focusedDate: TODAY_STR
        };

        let appState = {};
        let historyStack = []; let historyIndex = -1; let isRestoring = false;
        let searchDebounceTimer = null; let drawerSearchTimer = null;
        let timelineInteractionCtx = { type: null, subtaskId: null, initialY: 0, initialStartMinute: 0, initialDuration: 0 };
        let contextMenuCtx = { type: null, arg1: null, arg2: null, arg3: null };
        let isGlobalDragging = false; let globalDraggedSubtaskId = null;
        let dragHoverNavTimer = null; let isTouch = false;
        let currentDateActionSubtaskId = null; let drawerFolderStates = {};
        let lastClickX = 0; let lastClickY = 0; let activeDateTriggerEl = null;

        let md3PickerYear = parseInt(TODAY_STR.split('-')[0]);
        let md3PickerMonth = parseInt(TODAY_STR.split('-')[1]);
        let md3PickerSelectedDate = TODAY_STR;

        let isCalendarGridGenerated = false;
        let calScrollInterval = null;
        let scrollDebounceTimer = null;

        const subjectColors = {
            "语文": { bg: "#F3E5F5", text: "#4A148C" }, "数学": { bg: "#E3F2FD", text: "#0D47A1" },
            "英语": { bg: "#E1F5FE", text: "#01579B" }, "物理": { bg: "#E8EAF6", text: "#1A237E" },
            "化学": { bg: "#E0F2F1", text: "#004D40" }, "地理": { bg: "#EFEBE9", text: "#4E342E" }
        };

        const SUPABASE_URL = 'https://mamubvgmcetepllznifl.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_HEeNPSqD75cWlnmZjcVHKA_Pw-OdL_A';
        const BUCKET_NAME = 'schedule-data';
        const FILE_NAME = 'data.json';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadStateFromSupabase() {
            try {
                const { data, error } = await supabaseClient.storage.from(BUCKET_NAME).download(FILE_NAME);
                if (error) throw error;
                const text = await data.text();
                const parsed = JSON.parse(text);
                localStorage.setItem("MD3_ATOMIC_SYSTEM_DATA", JSON.stringify(parsed));
                return parsed;
            } catch (err) {
                const cached = localStorage.getItem("MD3_ATOMIC_SYSTEM_DATA");
                if (cached) { try { return JSON.parse(cached); } catch (e) { } }
                return JSON.parse(JSON.stringify(defaultInitialState));
            }
        }

        function commitState() {
            if (isRestoring) return;
            if (historyIndex < historyStack.length - 1) historyStack = historyStack.slice(0, historyIndex + 1);
            historyStack.push(JSON.parse(JSON.stringify(appState)));
            if (historyStack.length > 50) historyStack.shift();
            else historyIndex++;
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--; isRestoring = true;
                appState = JSON.parse(JSON.stringify(historyStack[historyIndex]));
                saveStateToStorage(false); renderAllComponents(); isRestoring = false;
            }
        }

        function redo() {
            if (historyIndex < historyStack.length - 1) {
                historyIndex++; isRestoring = true;
                appState = JSON.parse(JSON.stringify(historyStack[historyIndex]));
                saveStateToStorage(false); renderAllComponents(); isRestoring = false;
            }
        }

        function saveStateToStorage(pushHistory = true) {
            if (pushHistory) commitState();
            localStorage.setItem("MD3_ATOMIC_SYSTEM_DATA", JSON.stringify(appState));
            supabaseClient.storage.from(BUCKET_NAME).upload(FILE_NAME, JSON.stringify(appState), { upsert: true, contentType: 'application/json' }).catch(() => { });
        }

        document.addEventListener("DOMContentLoaded", async () => {
            appState = await loadStateFromSupabase();
            appState.searchQuery = "";
            commitState();
            initializeTheme();
            setupDragHoverNavigation();

            // Generate continuous calendar
            generateContinuousCalendar();
            setupCalendarDelegation();

            renderAllComponents();
            document.getElementById("today-date-display").innerText = TODAY_STR;

            // Jump to focused date after brief rendering delay
            setTimeout(() => { scrollToDate(appState.focusedDate, appState.calendarMode); }, 150);

            document.addEventListener("mousedown", (e) => {
                lastClickX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
                lastClickY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
            }, { passive: true });

            document.addEventListener("touchstart", (e) => {
                lastClickX = e.touches[0].clientX || 0;
                lastClickY = e.touches[0].clientY || 0;
            }, { passive: true });

            document.addEventListener("click", (e) => {
                document.getElementById("custom-context-menu").style.display = "none";
                if (!e.target.closest('#date-quick-menu') && !e.target.closest('[data-date-chip]')) document.getElementById("date-quick-menu").style.display = "none";
                if (!e.target.closest('#md3-datepicker-modal') && !e.target.closest('#date-quick-menu') && !e.target.closest('#custom-context-menu') && !e.target.closest('[data-date-chip]')) closeMD3DatePicker();
                if (!e.target.closest('#drawer-search-results') && e.target.id !== 'drawer-search-input') {
                    const res = document.getElementById('drawer-search-results');
                    if (res) { res.classList.add('hidden'); res.classList.remove('flex'); }
                }
            });

            document.addEventListener("dragstart", () => { isGlobalDragging = true; hideGlobalTooltip(); });
            document.addEventListener("dragend", () => { isGlobalDragging = false; globalDraggedSubtaskId = null; clearTimeout(dragHoverNavTimer); stopAutoScroll(); });
            document.addEventListener("drop", () => { isGlobalDragging = false; globalDraggedSubtaskId = null; clearTimeout(dragHoverNavTimer); stopAutoScroll(); });

            window.addEventListener('touchstart', () => isTouch = true, { passive: true });
            document.addEventListener('keydown', e => {
                if (e.ctrlKey || e.metaKey) {
                    if (e.key === 'z') { e.preventDefault(); undo(); }
                    if (e.key === 'y') { e.preventDefault(); redo(); }
                }
            });
        });

        function setupDragHoverNavigation() {
            const sidebarNavIds = ['nav-home', 'nav-today', 'nav-calendar'];
            sidebarNavIds.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        if (isGlobalDragging && !el.dataset.dragOverActive) {
                            el.dataset.dragOverActive = "true";
                            clearTimeout(dragHoverNavTimer);
                            dragHoverNavTimer = setTimeout(() => { switchView(id.replace('nav-', '')); }, 800);
                        }
                    });
                    el.addEventListener('dragleave', () => { el.removeAttribute('data-drag-over-active'); clearTimeout(dragHoverNavTimer); });
                    el.addEventListener('drop', () => { el.removeAttribute('data-drag-over-active'); clearTimeout(dragHoverNavTimer); });
                }
            });
        }

        function generateContinuousCalendar() {
            const monthGrid = document.getElementById("month-grid-container");
            const weekGrid = document.getElementById("week-grid-container");
            monthGrid.innerHTML = ""; weekGrid.innerHTML = "";

            // Generate calendar buffer
            const startDate = new Date();
            startDate.setFullYear(startDate.getFullYear() - 1);
            startDate.setDate(1);
            let day = startDate.getDay(); if (day === 0) day = 7;
            startDate.setDate(startDate.getDate() - day + 1);

            const endDate = new Date();
            endDate.setFullYear(endDate.getFullYear() + 2);

            let currDate = new Date(startDate);
            let htmlMonth = "", htmlWeek = "";
            const weekdays = ["日", "一", "二", "三", "四", "五", "六"];

            while (currDate <= endDate) {
                const dateStr = new Date(currDate.getTime() - currDate.getTimezoneOffset() * 60000).toISOString().split('T')[0];
                const isToday = dateStr === TODAY_STR;
                const dayNum = currDate.getDate();
                const monthNum = currDate.getMonth() + 1;
                const wdStr = weekdays[currDate.getDay()];

                let dateLabel = dayNum;
                if (dayNum === 1) dateLabel = `<span class="text-[var(--md-sys-color-primary)] font-black text-[12px] md:text-[13px]">${monthNum}月</span>`;

                    <div class="flex justify-between items-center px-1 pt-0.5 md:pt-1 flex-shrink-0 pointer-events-none">
                        <span class="w-1.5 h-1.5 rounded-full bg-transparent focus-dot"></span>
                        <span class="w-auto px-1.5 h-5 md:h-6 rounded-full flex items-center justify-center font-bold text-[10px] md:text-[11px] ${isToday ? 'bg-[var(--md-sys-color-primary)] text-[var(--md-sys-color-on-primary)] shadow-md' : 'text-[var(--md-sys-color-on-surface-variant)]'}">${dateLabel}</span>
                    </div>
                    <div class="task-box flex flex-col gap-1 px-0.5 md:px-1 flex-1 overflow-y-auto md-scrollbar pb-1 pointer-events-auto"></div>
                </div>`;

                // Week Cell
                htmlWeek += `
                <div class="p-1 border-r border-[var(--md-sys-color-outline-variant)] flex flex-col gap-1 hover:bg-black/5 dark:hover:bg-white/5 transition-colors min-h-[70px] relative flex-shrink-0 cell-target" style="width: 14.2857%; min-width: 60px; max-width: 150px;" data-date="${dateStr}">
                    <div class="flex justify-between items-center px-1 pt-0.5 md:pt-1 flex-shrink-0 pointer-events-none">
                        <span class="text-[9px] text-[var(--md-sys-color-outline)] font-bold">周${wdStr}</span>
                        <span class="w-auto px-1.5 h-5 md:h-6 rounded-full flex items-center justify-center font-bold text-[10px] md:text-[11px] ${isToday ? 'bg-[var(--md-sys-color-primary)] text-[var(--md-sys-color-on-primary)] shadow-md' : 'text-[var(--md-sys-color-on-surface-variant)]'}">${monthNum}/${dayNum}</span>
                        <span class="w-1.5 h-1.5 rounded-full bg-transparent focus-dot absolute top-1.5 right-1.5"></span>
                    </div>
                    <div class="task-box flex flex-col gap-1 px-0.5 md:px-1 flex-1 overflow-y-auto md-scrollbar pb-1 pointer-events-auto"></div>
                </div>`;

                currDate.setDate(currDate.getDate() + 1);
            }
            monthGrid.innerHTML = htmlMonth;
            weekGrid.innerHTML = htmlWeek;
            isCalendarGridGenerated = true;
        }

        function updateCalendarTaskRendering() {
            if (!isCalendarGridGenerated) return;
            const monthGrid = document.getElementById("month-grid-container");
            const weekGrid = document.getElementById("week-grid-container");

            document.querySelectorAll('#view-calendar .task-box').forEach(box => box.innerHTML = '');
            document.querySelectorAll('#view-calendar .focus-dot').forEach(dot => dot.className = dot.className.replace('bg-[var(--md-sys-color-primary)]', 'bg-transparent'));
            document.querySelectorAll('#view-calendar .focused-cell-bg').forEach(cell => cell.classList.remove('bg-[var(--md-sys-color-secondary-container)]/40', 'shadow-inner', 'focused-cell-bg'));

            if (appState.focusedDate) {
                const mCell = monthGrid.querySelector(`[data-date="${appState.focusedDate}"]`);
                if (mCell && appState.calendarMode === 'week') {
                    mCell.classList.add('bg-[var(--md-sys-color-secondary-container)]/40', 'shadow-inner', 'focused-cell-bg');
                }
                const wCell = weekGrid.querySelector(`[data-date="${appState.focusedDate}"]`);
                if (wCell) {
                    wCell.classList.add('bg-[var(--md-sys-color-secondary-container)]/40', 'shadow-inner', 'focused-cell-bg');

            }

            let tasksHtmlMap = {};
            appState.batches.forEach(batch => {
                batch.subtasks.forEach(subtask => {
                    if (subtask.endDate) {
                        if (!tasksHtmlMap[subtask.endDate]) tasksHtmlMap[subtask.endDate] = '';
                        const starredHighlight = subtask.starred ? 'starred-calendar-item font-black ring-1 ring-amber-400' : '';
                        const starIcon = subtask.starred ? '<span class="material-symbols-outlined star-filled text-[12px] flex-shrink-0">grade</span>' : '';
                        const bgColor = subjectColors[batch.subject]?.text || "#6750A4";
                        const doneClass = subtask.done ? 'opacity-50 line-through saturate-50' : '';

                        tasksHtmlMap[subtask.endDate] += `<div id="cal-sub-${subtask.id}" class="cal-task-item text-[8px] md:text-[9px] px-1 md:px-1.5 py-0.5 md:py-1 rounded truncate font-bold text-white shadow-sm cursor-grab hover:brightness-110 active:scale-95 transition-all flex items-center gap-0.5 ${starredHighlight} ${doneClass}" style="background-color: ${bgColor}; min-height: 20px; flex-shrink: 0;" draggable="true" data-subtask-id="${subtask.id}" data-batch-id="${batch.id}">${starIcon}<span class="truncate">${subtask.text}</span></div>`;
                    }
                });
            });

            for (const [dateStr, htmlStr] of Object.entries(tasksHtmlMap)) {
                const mBox = monthGrid.querySelector(`[data-date="${dateStr}"] .task-box`);
                if (mBox) mBox.innerHTML = htmlStr;
                const wBox = weekGrid.querySelector(`[data-date="${dateStr}"] .task-box`);

        function setupCalendarDelegation() {
            const monthGrid = document.getElementById("calendar-month-scroll");
            const weekGrid = document.getElementById("calendar-week-scroll");

            [monthGrid, weekGrid].forEach(container => {
                container.addEventListener("dragenter", (e) => {
                    const cell = e.target.closest('.cell-target');
                    if (cell && !cell.classList.contains("drag-hover")) {
                        document.querySelectorAll('.drag-hover').forEach(el => el.classList.remove('drag-hover'));
                        cell.classList.add("drag-hover");
                    }
                });
                container.addEventListener("dragover", (e) => {
                    e.preventDefault();
                    handleAutoScroll(e, container, container.id === "calendar-month-scroll");
                });
                container.addEventListener("dragleave", (e) => {
                    const cell = e.target.closest('.cell-target');
                    if (cell && e.relatedTarget && !cell.contains(e.relatedTarget)) cell.classList.remove("drag-hover");
                });
                container.addEventListener("drop", (e) => {
                    e.preventDefault();
                    stopAutoScroll();
                    const cell = e.target.closest('.cell-target');
                    if (cell) {
                        cell.classList.remove("drag-hover");
                        dropToCalendarCell(e, cell.getAttribute("data-date"), cell);
                    }

                container.addEventListener("click", (e) => {
                    const taskEl = e.target.closest('.cal-task-item');
                    if (taskEl) return;
                    const cell = e.target.closest('.cell-target');

                        appState.focusedDate = cell.getAttribute("data-date");
                        if (appState.calendarMode === 'month') switchCalendarMode('week');
                        else { focusDayTimeline(appState.focusedDate); scrollToDate(appState.focusedDate, 'week'); }
                        updateCalendarTaskRendering();
                    }
                });
            });

            document.addEventListener("dragstart", (e) => {
                const taskItem = e.target.closest('.cal-task-item');
                if (taskItem) handleSubtaskDragStart(e, taskItem.dataset.subtaskId);
            });
            document.addEventListener("click", (e) => {
                const taskItem = e.target.closest('.cal-task-item');
                if (taskItem) { e.stopPropagation(); expandToDrawerTask(taskItem.dataset.subtaskId); }
            });

            let touchTimer = null;
            document.addEventListener("touchstart", (e) => {
                const taskItem = e.target.closest('.cal-task-item');
                if (taskItem) touchTimer = setTimeout(() => handleContextMenu(e, 'task_calendar', taskItem.dataset.batchId, taskItem.dataset.subtaskId), 500);
            }, { passive: true });
            document.addEventListener("touchend", () => clearTimeout(touchTimer));
            document.addEventListener("touchmove", () => clearTimeout(touchTimer));

            document.addEventListener("contextmenu", (e) => {
                const taskItem = e.target.closest('.cal-task-item');
                if (taskItem) { e.preventDefault(); handleContextMenu(e, 'task_calendar', taskItem.dataset.batchId, taskItem.dataset.subtaskId); }
            });

            document.addEventListener("mousemove", (e) => {
                const taskItem = e.target.closest('.cal-task-item');
                if (taskItem) showGlobalTooltip(e, taskItem.dataset.subtaskId);
                else hideGlobalTooltip();
            });
        }

        function handleAutoScroll(e, container, isVertical) {
            if (!isGlobalDragging) return;
            const rect = container.getBoundingClientRect();
            const threshold = 50; // Sensitive zone threshold (50px)
            let speedX = 0, speedY = 0;

            if (isVertical) {
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                const y = clientY - rect.top;
                if (y < threshold) {
                    speedY = -8; // Lowered scroll speed for smoother control
                } else if (y > rect.height - threshold) {
                    speedY = 8;
                }
            } else {
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const x = clientX - rect.left;
                if (x < threshold) {
                    speedX = -8;
                } else if (x > rect.width - threshold) {
                    speedX = 8;
                }
            }

            if (speedX !== 0 || speedY !== 0) {
                if (!calScrollInterval) {
                    calScrollInterval = setInterval(() => {
                        if (isVertical) container.scrollTop += speedY;
                        else container.scrollLeft += speedX;
                    }, 20);
                }
            } else {
                stopAutoScroll();
            }
        }

        function stopAutoScroll() {
            if (calScrollInterval) {
                clearInterval(calScrollInterval);
                calScrollInterval = null;
            }
        }

        function handleCalendarScroll(e, isVertical) {
            if (!scrollDebounceTimer) {
                scrollDebounceTimer = setTimeout(() => {
                    scrollDebounceTimer = null;
                    const container = e.target;
                    const rect = container.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;

                    const elem = document.elementFromPoint(centerX, centerY);
                    const dateCell = elem?.closest('.cell-target');
                    if (dateCell) {
                        const dStr = dateCell.getAttribute('data-date');
                        const parts = dStr.split('-');
                        appState.calendarYear = parseInt(parts[0]);
                        appState.calendarMonth = parseInt(parts[1]);
                        document.getElementById("calendar-month-title").innerText = `${appState.calendarYear}年 ${appState.calendarMonth}月`;
                    }
                }, 80);
            }
        }

        function scrollToDate(dateStr, mode) {
            if (!dateStr) return;
            const container = mode === 'month' ? document.getElementById('calendar-month-scroll') : document.getElementById('calendar-week-scroll');
            const targetCell = container?.querySelector(`[data-date="${dateStr}"]`);

            if (targetCell && container) {
                if (mode === 'month') {
                    const offset = targetCell.offsetTop - container.clientHeight / 2 + targetCell.clientHeight / 2;
                    container.scrollTo({ top: offset, behavior: 'smooth' });
                } else {
                    const offset = targetCell.offsetLeft - container.clientWidth / 2 + targetCell.clientWidth / 2;
                    container.scrollTo({ left: offset, behavior: 'smooth' });
                }
                const parts = dateStr.split('-');
                document.getElementById("calendar-month-title").innerText = `${parts[0]}年 ${parseInt(parts[1])}月`;
            }
        }

        function findSubtask(subtaskId) {
            for (let b of appState.batches) {
                let s = b.subtasks.find(x => x.id === subtaskId);
                if (s) return { batch: b, subtask: s };
            }
            return null;
        }

        function toggleSubtaskStar(subtaskId, event, btnEl) {
            if (event) event.stopPropagation();
            const target = findSubtask(subtaskId);
            if (target) {
                target.subtask.starred = !target.subtask.starred;
                if (btnEl) {
                    const icon = btnEl.querySelector('.material-symbols-outlined') || btnEl;
                    icon.classList.add('star-pop'); setTimeout(() => icon.classList.remove('star-pop'), 400);
