                saveStateToStorage(); renderAllComponents();
            }
        }

        function expandToDrawerTask(subId, query = '') {
            if (query) document.getElementById('drawer-search-input').value = query;
            locateDrawerSearchResult(subId, query);
        }

        function openDateQuickMenu(subtaskId, event) {
            if (event) event.stopPropagation();
            currentDateActionSubtaskId = subtaskId;
            activeDateTriggerEl = event ? event.currentTarget : null;
            const menu = document.getElementById('date-quick-menu');
            let x = event ? event.clientX : lastClickX, y = event ? event.clientY : lastClickY;
            if (activeDateTriggerEl) { const rect = activeDateTriggerEl.getBoundingClientRect(); x = rect.left; y = rect.bottom + 4; }
            menu.style.display = "flex";
            const width = 140, height = 80;
            if (x + width > window.innerWidth - 8) x = window.innerWidth - width - 8;
            if (y + height > window.innerHeight - 8) y = y - height - 30;
            menu.style.left = `${x}px`; menu.style.top = `${y}px`;
        }

        function executeDateAction(type) {
            document.getElementById('date-quick-menu').style.display = "none";
            if (!currentDateActionSubtaskId) return;
            if (type === 'today') {
                const target = findSubtask(currentDateActionSubtaskId);
                if (target) { target.subtask.endDate = TODAY_STR; saveStateToStorage(); renderAllComponents(); }
            } else if (type === 'custom') { openMD3DatePicker(currentDateActionSubtaskId); }
        }

        function openMD3DatePicker(subtaskId) {
            currentDateActionSubtaskId = subtaskId;
            const target = findSubtask(subtaskId);
            const currentVal = target?.subtask.endDate || TODAY_STR;
            md3PickerSelectedDate = currentVal;
            const parts = currentVal.split('-');
            md3PickerYear = parseInt(parts[0]) || parseInt(TODAY_STR.split('-')[0]);
            md3PickerMonth = parseInt(parts[1]) || parseInt(TODAY_STR.split('-')[1]);

            renderMD3DatePicker();
            const pickerEl = document.getElementById('md3-datepicker-modal');
            let anchorX = lastClickX, anchorY = lastClickY;
            if (activeDateTriggerEl) { const rect = activeDateTriggerEl.getBoundingClientRect(); anchorX = rect.left; anchorY = rect.bottom + 6; }
            pickerEl.style.display = 'flex'; pickerEl.style.position = 'fixed';
            const width = 300, height = 320;
            if (anchorX + width > window.innerWidth - 12) anchorX = window.innerWidth - width - 12;
            if (anchorX < 12) anchorX = 12;
            if (anchorY + height > window.innerHeight - 12) anchorY = anchorY - height - 40;
            if (anchorY < 12) anchorY = 12;
            pickerEl.style.left = `${anchorX}px`; pickerEl.style.top = `${anchorY}px`;
            requestAnimationFrame(() => { pickerEl.classList.remove('opacity-0', 'scale-95'); pickerEl.classList.add('opacity-100', 'scale-100'); });
        }

        function closeMD3DatePicker() {
            const pickerEl = document.getElementById('md3-datepicker-modal');
            pickerEl.classList.remove('opacity-100', 'scale-100'); pickerEl.classList.add('opacity-0', 'scale-95');
            setTimeout(() => { pickerEl.style.display = 'none'; }, 150);
        }

        function navigateMD3PickerMonth(dir) {
            md3PickerMonth += dir;
            if (md3PickerMonth > 12) { md3PickerMonth = 1; md3PickerYear++; }
            if (md3PickerMonth < 1) { md3PickerMonth = 12; md3PickerYear--; }
            renderMD3DatePicker();
        }

        function selectMD3PickerDate(dateStr) { md3PickerSelectedDate = dateStr; renderMD3DatePicker(); }

        function confirmMD3DatePicker() {
            if (currentDateActionSubtaskId && md3PickerSelectedDate) {
                const target = findSubtask(currentDateActionSubtaskId);
                if (target) { target.subtask.endDate = md3PickerSelectedDate; saveStateToStorage(); renderAllComponents(); }
            }
            closeMD3DatePicker();
        }

        function renderMD3DatePicker() {
            document.getElementById('md3-picker-month-year').innerText = `${md3PickerYear}年 ${md3PickerMonth}月`;
            const selParts = md3PickerSelectedDate.split('-');
            document.getElementById('md3-picker-header-date').innerText = `${selParts[0]}年${parseInt(selParts[1])}月${parseInt(selParts[2])}日`;
            const grid = document.getElementById('md3-picker-days-grid');
            grid.innerHTML = '';
            const firstDay = new Date(md3PickerYear, md3PickerMonth - 1, 1).getDay();
            const totalDays = new Date(md3PickerYear, md3PickerMonth, 0).getDate();
            for (let i = 0; i < firstDay; i++) grid.insertAdjacentHTML('beforeend', `<div></div>`);
            for (let day = 1; day <= totalDays; day++) {
                const dateStr = `${md3PickerYear}-${String(md3PickerMonth).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isSelected = dateStr === md3PickerSelectedDate;
                const isToday = dateStr === TODAY_STR;
                let btnClass = "w-7 h-7 rounded-full mx-auto flex items-center justify-center text-xs font-semibold transition-all ";
                if (isSelected) btnClass += "bg-[var(--md-sys-color-primary)] text-[var(--md-sys-color-on-primary)] shadow-md font-bold";
                else if (isToday) btnClass += "border-2 border-[var(--md-sys-color-primary)] text-[var(--md-sys-color-primary)] font-bold";
                else btnClass += "hover:bg-black/10 dark:hover:bg-white/10 text-[var(--md-sys-color-on-surface)]";
                grid.insertAdjacentHTML('beforeend', `<button type="button" onclick="selectMD3PickerDate('${dateStr}')" class="${btnClass}">${day}</button>`);
            }
        }

        function jumpToCalendar(dateStr) {
            if (!dateStr || dateStr === '待分发' || dateStr === 'null') return;
            appState.focusedDate = dateStr;
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return;
            appState.calendarYear = d.getFullYear();
            appState.calendarMonth = d.getMonth() + 1;
            switchCalendarMode('month');
            switchView('calendar');
            scrollToDate(dateStr, 'month');
            setTimeout(() => {
                const cell = document.querySelector(`#calendar-month-scroll [data-date="${dateStr}"]`);
                if (cell) {
                    cell.classList.add('locate-highlight');
                    setTimeout(() => cell.classList.remove('locate-highlight'), 2000);
                }
            }, 300);
        }

        function allowDrop(e) { e.preventDefault(); }
        function handleDragLeave(e) { e.currentTarget.classList.remove("drag-hover", "meta-drop-hover"); }

        function handleSubtaskDragStart(e, subtaskId) {
            e.dataTransfer.setData("text/plain", subtaskId);
            e.dataTransfer.effectAllowed = "move";
            isGlobalDragging = true; globalDraggedSubtaskId = subtaskId;
            hideGlobalTooltip(); document.getElementById("custom-context-menu").style.display = "none";
            const taskEl = document.querySelector(`[data-subtask-id="${subtaskId}"]`);
            if (taskEl) {
                let parent = taskEl.parentElement;
                while (parent && parent.id !== 'drawer-task-container') {
                    if (parent.classList.contains('folder-content')) {
                        parent.classList.remove('open');
                        const header = parent.previousElementSibling;
                        if (header) {
                            const icon = header.querySelector('.folder-icon');
                            if (icon) icon.classList.remove('open');
                            const folderId = header.getAttribute('data-folder-id');
                            if (folderId) drawerFolderStates[folderId] = false;
                        }
                    }
                    parent = parent.parentElement;
                }
            }
        }

        function dropToCalendarCell(e, dateStr, cellEl) {
            e.preventDefault(); cellEl.classList.remove("drag-hover");
            const subtaskId = e.dataTransfer.getData("text/plain") || globalDraggedSubtaskId;
            const target = findSubtask(subtaskId);
            if (target) {
                target.subtask.endDate = dateStr; saveStateToStorage(); renderAllComponents();
                if (appState.calendarMode === 'week') focusDayTimeline(appState.focusedDate);
            }
            isGlobalDragging = false;
            stopAutoScroll();
        }

        function dropToTimelineTrack(e) {
            e.preventDefault();
            const subtaskId = e.dataTransfer.getData("text/plain") || globalDraggedSubtaskId;
            const target = findSubtask(subtaskId);
            if (!target) return;
            const rect = document.getElementById("timeline-track-wrapper")?.getBoundingClientRect() || e.currentTarget.getBoundingClientRect();
            const dropY = (e.clientY || (e.changedTouches && e.changedTouches[0].clientY)) - rect.top;
            let targetMinute = Math.round(dropY / 10) * 10;
            targetMinute = Math.max(0, Math.min(1440 - target.subtask.durationMinutes, targetMinute));
            target.subtask.endDate = appState.focusedDate; target.subtask.startMinute = targetMinute;
            saveStateToStorage(); renderAllComponents(); focusDayTimeline(appState.focusedDate);
            isGlobalDragging = false;
            stopAutoScroll();
        }

        function allowDropToday(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; }
        function dropToTodayArea(e) {
            e.preventDefault();
            const subtaskId = e.dataTransfer.getData("text/plain") || globalDraggedSubtaskId;
            const target = findSubtask(subtaskId);
            if (target) { target.subtask.endDate = TODAY_STR; saveStateToStorage(); renderAllComponents(); }
            isGlobalDragging = false;
            stopAutoScroll();
        }

        function startTimelineCardDrag(e, subtaskId) {
            e.stopPropagation(); if (e.type !== 'touchstart') e.preventDefault();
            timelineInteractionCtx.type = 'drag'; timelineInteractionCtx.subtaskId = subtaskId;
            timelineInteractionCtx.initialY = e.clientY || (e.touches && e.touches[0].clientY);
            const target = findSubtask(subtaskId);
            timelineInteractionCtx.initialStartMinute = target.subtask.startMinute;
            isGlobalDragging = true; hideGlobalTooltip();
            window.addEventListener("mousemove", doTimelineResizeOrDrag); window.addEventListener("mouseup", stopTimelineResizeOrDrag);
            window.addEventListener("touchmove", doTimelineResizeOrDrag, { passive: false }); window.addEventListener("touchend", stopTimelineResizeOrDrag);
        }

        function startTimelineResize(e, subtaskId) {
            e.stopPropagation(); if (e.type !== 'touchstart') e.preventDefault();
            timelineInteractionCtx.type = 'resize'; timelineInteractionCtx.subtaskId = subtaskId;
            timelineInteractionCtx.initialY = e.clientY || (e.touches && e.touches[0].clientY);
            const target = findSubtask(subtaskId);
            timelineInteractionCtx.initialDuration = target.subtask.durationMinutes;
            isGlobalDragging = true; hideGlobalTooltip();
            window.addEventListener("mousemove", doTimelineResizeOrDrag); window.addEventListener("mouseup", stopTimelineResizeOrDrag);
            window.addEventListener("touchmove", doTimelineResizeOrDrag, { passive: false }); window.addEventListener("touchend", stopTimelineResizeOrDrag);
        }

        function doTimelineResizeOrDrag(e) {
            if (!timelineInteractionCtx.type) return;
            if (e.type === 'touchmove') e.preventDefault();
            const currentY = e.clientY || (e.touches && e.touches[0].clientY);
            const deltaY = currentY - timelineInteractionCtx.initialY;
            const minuteDelta = Math.round(deltaY / 10) * 10;
            const target = findSubtask(timelineInteractionCtx.subtaskId);
            if (!target) return;
            if (timelineInteractionCtx.type === 'resize') {
                let newDur = timelineInteractionCtx.initialDuration + minuteDelta;
                target.subtask.durationMinutes = Math.max(10, Math.min(1440 - target.subtask.startMinute, newDur));
            } else if (timelineInteractionCtx.type === 'drag') {
                let newStart = timelineInteractionCtx.initialStartMinute + minuteDelta;
                target.subtask.startMinute = Math.max(0, Math.min(1440 - target.subtask.durationMinutes, newStart));
            }
            focusDayTimeline(appState.focusedDate);
        }

        function stopTimelineResizeOrDrag() {
            if (timelineInteractionCtx.type) {
                timelineInteractionCtx.type = null; timelineInteractionCtx.subtaskId = null;
                window.removeEventListener("mousemove", doTimelineResizeOrDrag); window.removeEventListener("mouseup", stopTimelineResizeOrDrag);
                window.removeEventListener("touchmove", doTimelineResizeOrDrag); window.removeEventListener("touchend", stopTimelineResizeOrDrag);
                isGlobalDragging = false; saveStateToStorage(); renderAllComponents();
            }
        }

        function showGlobalTooltip(e, subtaskId) {
            if (isGlobalDragging || isTouch) return;
            const target = findSubtask(subtaskId);
            if (!target) return;
            const tooltip = document.getElementById("global-tooltip");
            let startM_v = target.subtask.startMinute || 480;
            let startH = String(Math.floor(startM_v / 60)).padStart(2, '0');
            let startM = String(startM_v % 60).padStart(2, '0');
            let endTotal = startM_v + target.subtask.durationMinutes;
            let endH = String(Math.floor(endTotal / 60)).padStart(2, '0');
            let endM = String(endTotal % 60).padStart(2, '0');
            tooltip.innerHTML = `
                <div class="font-bold text-[var(--md-sys-color-primary)] text-sm mb-1 flex items-center justify-between">
                    <span>${target.subtask.text}</span>
                    ${target.subtask.starred ? '<span class="material-symbols-outlined star-filled text-sm ml-1">grade</span>' : ''}
                </div>
                <div class="text-[var(--md-sys-color-on-surface-variant)] font-medium">属: ${target.batch.title}</div>
                <div class="mt-1.5 flex gap-2"><span class="px-1.5 py-0.5 bg-black/5 dark:bg-white/10 rounded border border-[var(--md-sys-color-outline-variant)]">科: ${target.batch.subject}</span></div>
                <div class="text-[var(--md-sys-color-outline)] font-mono mt-1.5">排程: ${target.subtask.startMinute === null ? '未分配时间' : `${startH}:${startM} - ${endH}:${endM} (${target.subtask.durationMinutes}分)`}</div>
            `;
            tooltip.style.display = "block"; tooltip.style.left = `${(e.clientX || (e.touches && e.touches[0].clientX)) + 14}px`; tooltip.style.top = `${(e.clientY || (e.touches && e.touches[0].clientY)) + 14}px`;
        }
        function hideGlobalTooltip() { document.getElementById("global-tooltip").style.display = "none"; }

        function handleContextMenu(e, type, arg1, arg2, arg3) {
            e.preventDefault(); e.stopPropagation(); hideGlobalTooltip(); contextMenuCtx = { type, arg1, arg2, arg3 };
            const menu = document.getElementById("custom-context-menu");
            let html = '';
            if (type === 'task_home' || type === 'task_drawer' || type === 'task_calendar' || type === 'task_today') {
                const target = findSubtask(arg2);
                const hasDate = target && !!target.subtask.endDate;
                const isStarred = target && !!target.subtask.starred;
                if (target) {
                    html += `<button onclick="executeContextMenuAction('toggle_star')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/5 text-amber-500 font-medium flex items-center gap-2 transition-colors"><span class="material-symbols-outlined text-sm ${isStarred ? 'star-filled' : 'star-outline'}">grade</span>${isStarred ? '取消星标' : '设为星标'}</button>`;
                    html += `<button onclick="executeContextMenuAction('toggle_status')" class="w-full text-left px-3 py-2 rounded-lg ${target.subtask.done ? 'hover:bg-black/5 dark:hover:bg-white/5 text-amber-600' : 'hover:bg-black/5 dark:hover:bg-white/5 text-emerald-600'} flex items-center gap-2 font-medium transition-colors"><span class="material-symbols-outlined text-sm">${target.subtask.done ? 'undo' : 'check_circle'}</span>${target.subtask.done ? '取消完成' : '完成此任务'}</button>`;
                }
                html += `<button onclick="executeContextMenuAction('set_date')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/5 flex items-center gap-2 text-[var(--md-sys-color-on-surface)] transition-colors"><span class="material-symbols-outlined text-sm">calendar_today</span>${hasDate ? '更改日期' : '设置日期'}</button>`;
                if (type !== 'task_calendar') html += `<button onclick="executeContextMenuAction('locate_calendar')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/5 flex items-center gap-2 text-[var(--md-sys-color-on-surface)] transition-colors ${!hasDate ? 'opacity-50 cursor-not-allowed' : ''}" ${!hasDate ? 'disabled' : ''}><span class="material-symbols-outlined text-sm">explore</span>定位到日历</button>`;
                html += `<button onclick="executeContextMenuAction('edit')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/5 flex items-center gap-2 text-[var(--md-sys-color-on-surface)] transition-colors"><span class="material-symbols-outlined text-sm">edit</span>编辑主任务</button>`;
                if (type === 'task_calendar') {
                    html += `<button onclick="executeContextMenuAction('unassign')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-orange-500/10 text-orange-500 flex items-center gap-2 transition-colors"><span class="material-symbols-outlined text-sm">event_busy</span>取消分配</button>`;
                    html += `<button onclick="executeContextMenuAction('unassign_time')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-orange-500/10 text-orange-500 flex items-center gap-2 transition-colors"><span class="material-symbols-outlined text-sm">timer_off</span>取消具体时间</button>`;
                }
                html += `<hr class="my-1 border-[var(--md-sys-color-outline-variant)]">`;
                html += `<button onclick="executeContextMenuAction('delete_task')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-red-500/10 dark:hover:bg-red-500/20 text-red-500 flex items-center gap-2 transition-colors"><span class="material-symbols-outlined text-sm">delete</span>删除此子任务</button>`;
            } else if (type === 'folder_main') {
                html += `<button onclick="executeContextMenuAction('add_subtask')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/5 flex items-center gap-2 text-[var(--md-sys-color-on-surface)] transition-colors"><span class="material-symbols-outlined text-sm">add</span>添加子任务</button>`;
                html += `<button onclick="executeContextMenuAction('delete_main')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-red-500/10 dark:hover:bg-red-500/20 text-red-500 flex items-center gap-2 transition-colors"><span class="material-symbols-outlined text-sm">delete</span>删除主任务</button>`;
            } else if (type === 'folder_subject') {
                html += `<button onclick="executeContextMenuAction('add_subject_task')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/5 flex items-center gap-2 text-[var(--md-sys-color-on-surface)] transition-colors"><span class="material-symbols-outlined text-sm">add</span>添加 [${arg1}] 任务</button>`;
                html += `<button onclick="executeContextMenuAction('delete_subject')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-red-500/10 dark:hover:bg-red-500/20 text-red-500 flex items-center gap-2 transition-colors"><span class="material-symbols-outlined text-sm">delete</span>删除此学科</button>`;
            } else if (type === 'folder_batch_tag') {
                html += `<button onclick="executeContextMenuAction('remove_tag_from_batch')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-orange-500/10 text-orange-500 flex items-center gap-2 transition-colors"><span class="material-symbols-outlined text-sm">label_off</span>移除「${arg3}」标签</button>`;
            } else if (type === 'folder_tag') {
                html += `<button onclick="executeContextMenuAction('delete_tag')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-red-500/10 dark:hover:bg-red-500/20 text-red-500 flex items-center gap-2 transition-colors"><span class="material-symbols-outlined text-sm">delete</span>删除此标签</button>`;
            }
            menu.innerHTML = html; menu.style.display = "block";
            let x = e.clientX || (e.touches && e.touches[0].clientX); let y = e.clientY || (e.touches && e.touches[0].clientY);
            const menuWidth = 150, menuHeight = menu.offsetHeight || 120;
            if (x + menuWidth > window.innerWidth) x -= menuWidth;
            if (y + menuHeight > window.innerHeight) y -= menuHeight;
            menu.style.left = `${x}px`; menu.style.top = `${y}px`;
        }

        function executeContextMenuAction(action) {
            const { type, arg1, arg2, arg3 } = contextMenuCtx;
            if (action === 'toggle_star') { toggleSubtaskStar(arg2); }
            else if (action === 'locate_calendar') { const target = findSubtask(arg2); if (target && target.subtask.endDate) jumpToCalendar(target.subtask.endDate); }
            else if (action === 'locate_home') {
                switchView('home'); setTimeout(() => {
                    const el = document.getElementById('home-sub-' + arg2);
                    if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('locate-highlight'); setTimeout(() => el.classList.remove('locate-highlight'), 2000); }
                }, 300);
            }
            else if (action === 'toggle_status') { toggleSubtaskStatus(arg2); }
            else if (action === 'set_date') { openMD3DatePicker(arg2); }
            else if (action === 'edit') { openEditTaskModal(arg1); }
            else if (action === 'unassign') { const target = findSubtask(arg2); if (target) { target.subtask.endDate = null; saveStateToStorage(); renderAllComponents(); } }
            else if (action === 'unassign_time') { const target = findSubtask(arg2); if (target) { target.subtask.startMinute = null; saveStateToStorage(); renderAllComponents(); if (appState.calendarMode === 'week') focusDayTimeline(appState.focusedDate); } }
            else if (action === 'delete_task') { const b = appState.batches.find(x => x.id === arg1); if (b) { b.subtasks = b.subtasks.filter(s => s.id !== arg2); saveStateToStorage(); renderAllComponents(); } }
            else if (action === 'add_subtask') { openEditTaskModal(arg1); addChecklistItemSlot(); setTimeout(() => { const s = document.getElementById("form-checklist-slots"); s.parentElement.scrollTop = s.parentElement.scrollHeight; }, 50); }
            else if (action === 'delete_main') { appState.batches = appState.batches.filter(b => b.id !== arg1); saveStateToStorage(); renderAllComponents(); }
            else if (action === 'add_subject_task') { openAddTaskModal(); selectFormSubject(arg1); }
            else if (action === 'delete_subject') { appState.subjects = appState.subjects.filter(s => s !== arg1); saveStateToStorage(); renderAllComponents(); }
            else if (action === 'remove_tag_from_batch') { const b = appState.batches.find(x => x.id === arg1); if (b) { b.tags = b.tags.filter(t => t !== arg3); saveStateToStorage(); renderAllComponents(); } }
            else if (action === 'delete_tag') { deleteMetaAsset('tag', arg1); }
        }

        function executeContextMenuActionObj(type, arg1, arg2, action) { contextMenuCtx = { type, arg1, arg2, arg3: null }; executeContextMenuAction(action); }

        function handleDrawerSearch(val) {
            clearTimeout(drawerSearchTimer);
            drawerSearchTimer = setTimeout(() => {
                const query = val.trim().toLowerCase();
                const resultsContainer = document.getElementById('drawer-search-results');
                const countContainer = document.getElementById('drawer-search-count');
                if (!query) { resultsContainer.classList.add('hidden'); countContainer.innerText = ''; return; }
                const keywords = query.split(/\s+/).filter(k => k);
                let results = [];
                appState.batches.forEach(b => {
                    b.subtasks.forEach(s => {
                        const tagsStr = b.tags.join(' ');
                        const dateStr = s.endDate || '待排程';
                        const textToSearch = (b.title + ' ' + b.content + ' ' + b.subject + ' ' + s.text + ' ' + tagsStr + ' ' + dateStr).toLowerCase();
                        if (keywords.every(k => textToSearch.includes(k))) results.push({ batch: b, subtask: s, matchedKeyword: keywords[0] });
                    });
                });
                countContainer.innerText = results.length;
                if (results.length > 0) {
                    resultsContainer.innerHTML = results.map(r => `
                        <div class="p-2.5 border-b border-[var(--md-sys-color-outline-variant)] last:border-0 cursor-pointer hover:bg-black/5 dark:hover:bg-white/5 transition-colors" onclick="locateDrawerSearchResult('${r.subtask.id}', '${r.matchedKeyword}')">
                            <div class="text-[10px] font-bold text-[var(--md-sys-color-primary)] flex items-center justify-between">
                                <span>${r.batch.title}</span><span class="opacity-70 font-mono text-[9px]">${r.subtask.endDate || '未分配'}</span>
                            </div>
                            <div class="text-xs text-[var(--md-sys-color-on-surface)] truncate mt-0.5">${r.subtask.text}</div>
                        </div>`).join('');
                    resultsContainer.classList.remove('hidden'); resultsContainer.classList.add('flex');
                } else { resultsContainer.classList.add('hidden'); resultsContainer.classList.remove('flex'); }
            }, 200);
        }

        function locateDrawerSearchResult(subtaskId, keyword = '') {
            document.getElementById('drawer-search-input').value = '';
            document.getElementById('drawer-search-results').classList.add('hidden');
            document.getElementById('drawer-search-count').innerText = '';
            changeDrawerArrange('starred');
            const drawer = document.getElementById('task-drawer');
            drawer.classList.remove('collapsed');
            document.getElementById('drawer-restore-btn').classList.add('hidden');

            setTimeout(() => {
                const el = document.querySelector(`#drawer-task-container [data-subtask-id="${subtaskId}"]`);
                if (el) {
                    let parent = el.parentElement;
                    while (parent && parent.id !== 'drawer-task-container') {
                        if (parent.classList.contains('folder-content')) {
                            parent.classList.add('open');
                            const header = parent.previousElementSibling;
                            if (header) {
                                const icon = header.querySelector('.folder-icon');
                                if (icon) icon.classList.add('open');
                                const folderId = header.getAttribute('data-folder-id');
                                if (folderId) drawerFolderStates[folderId] = true;
                            }
                        }
                        parent = parent.parentElement;
                    }
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    el.classList.add('locate-highlight');
                    setTimeout(() => el.classList.remove('locate-highlight'), 2000);
                }
            }, 100);
        }

        function executeQuickMetaAdd() {
            const input = document.getElementById("drawer-quick-input");
            const value = input.value.trim();
            if (!value) return;
            const currentMode = appState.currentDrawerArrange;
            if (currentMode === 'subject' && !appState.subjects.includes(value)) appState.subjects.push(value);
            else if (currentMode === 'tag' && !appState.tags.some(t => t.name === value)) {
                const color = document.getElementById("drawer-quick-color").value;
                appState.tags.push({ name: value, color: color });
            }
            input.value = ""; saveStateToStorage(); renderAllComponents();
        }

        function checkDragCompatibility(subtaskId, targetArrange, dropValue) {
            if (!subtaskId) return true;
            const task = findSubtask(subtaskId);
            if (!task) return true;
            if (targetArrange === 'group') return task.batch.title === dropValue;
            if (targetArrange === 'subject') return task.batch.subject === dropValue;
            return true;
        }

        function dropToMetaCategory(e, dimension, value, element) {
            e.preventDefault(); element.classList.remove("meta-drop-hover");
            const subtaskId = e.dataTransfer.getData("text/plain") || globalDraggedSubtaskId;
            if (!subtaskId || !checkDragCompatibility(subtaskId, dimension, value)) { isGlobalDragging = false; return; }
            const target = findSubtask(subtaskId);
            if (!target) return;
            if (dimension === 'tag') { if (!target.batch.tags.includes(value)) target.batch.tags.push(value); }
            else if (dimension === 'time') {
                if (value === '待排程') { target.subtask.endDate = null; }
                else if (value && /^\d{4}-\d{2}-\d{2}$/.test(value)) { target.subtask.endDate = value; }
                else return;
            }
            saveStateToStorage(); renderAllComponents(); isGlobalDragging = false;
        }

        function toggleFolder(el) {
            const content = el.parentElement.querySelector('.folder-content');
            const icon = el.querySelector('.folder-icon');
            const folderId = el.getAttribute('data-folder-id');
            const isNowOpen = content.classList.toggle('open');
            if (icon) icon.classList.toggle('open');
            if (folderId) drawerFolderStates[folderId] = isNowOpen;
        }

        function handleFolderDragOver(e, folderId, folderCategory, dropValue) {
            e.preventDefault();
            const subtaskId = e.dataTransfer.getData("text/plain") || globalDraggedSubtaskId;
            if (!subtaskId || !checkDragCompatibility(subtaskId, folderCategory, dropValue)) { e.dataTransfer.dropEffect = 'none'; return; }
            e.dataTransfer.dropEffect = 'move';
            const selfHeader = document.querySelector(`[data-folder-id="${folderId}"]`);
            if (selfHeader) {
                const parentBox = selfHeader.closest('.target-inner') || document.getElementById('drawer-task-container');
                if (parentBox) {
                    const siblingHeaders = parentBox.querySelectorAll(`:scope > div > .folder-header`);
                    siblingHeaders.forEach(sib => {
                        const sibId = sib.getAttribute('data-folder-id');
                        if (sibId && sibId !== folderId) {
                            const sibContent = sib.parentElement.querySelector('.folder-content');
                            const sibIcon = sib.querySelector('.folder-icon');
                            if (sibContent && sibContent.classList.contains('open')) {
                                sibContent.classList.remove('open');
                                if (sibIcon) sibIcon.classList.remove('open');
                                drawerFolderStates[sibId] = false;
                            }
                        }
                    });
                }
            }
        }

        function locateDrawerToday() {
            const timeTodayId = `time_d_${TODAY_STR}`;
            const targetFolder = document.querySelector(`[data-folder-id="${timeTodayId}"]`);
            if (targetFolder) {
                let parent = targetFolder.parentElement;
                while (parent && parent.id !== 'drawer-task-container') {
                    if (parent.classList.contains('folder-content')) {
                        parent.classList.add('open');
                        const header = parent.previousElementSibling;
                        if (header) {
                            const icon = header.querySelector('.folder-icon');
                            if (icon) icon.classList.add('open');
                            const folderId = header.getAttribute('data-folder-id');
                            if (folderId) drawerFolderStates[folderId] = true;
                        }
                    }
                    parent = parent.parentElement;
                }
                targetFolder.scrollIntoView({ behavior: 'smooth', block: 'center' });
                targetFolder.classList.add('locate-highlight');
                setTimeout(() => targetFolder.classList.remove('locate-highlight'), 2000);
            } else { alert("今日无安排"); }
        }

        function renderLeftDrawerPool() {
            const container = document.getElementById("drawer-task-container");
            container.innerHTML = "";
            const currentMode = appState.currentDrawerArrange;
            const locatorContainer = document.getElementById('drawer-today-locator-container');
            if (currentMode === 'time') { locatorContainer.classList.remove('hidden'); locatorContainer.classList.add('flex'); }
            else { locatorContainer.classList.remove('flex'); locatorContainer.classList.add('hidden'); }

            function createFolderDom(title, dropValue = null, contextMenuAttr = '', extraHtml = '', iconColor = 'var(--md-sys-color-primary)', folderId = '') {
                const wrapper = document.createElement("div");
                wrapper.className = "flex flex-col rounded-xl mb-0.5 transition-colors border border-transparent w-full";
                let counter = 0; let dragExpandTimer;
                wrapper.addEventListener("dragenter", (e) => {
                    e.preventDefault(); e.stopPropagation(); counter++;
                    if (counter === 1) {
                        const subId = e.dataTransfer.getData("text/plain") || globalDraggedSubtaskId;
                        const isComp = checkDragCompatibility(subId, currentMode, dropValue);
                        if (isComp && dropValue !== null && dropValue !== 'group_disabled' && dropValue !== 'subject_disabled') {
                            wrapper.classList.add("meta-drop-hover");
                            dragExpandTimer = setTimeout(() => {
                                const content = wrapper.querySelector('.folder-content');
                                if (content) { content.classList.add('open'); drawerFolderStates[folderId] = true; }
                                wrapper.querySelector('.folder-icon')?.classList.add('open');
                            }, 600);
                        }
                    }
                });
                wrapper.addEventListener("dragleave", (e) => { e.stopPropagation(); counter--; if (counter === 0) { wrapper.classList.remove("meta-drop-hover"); clearTimeout(dragExpandTimer); } });
                wrapper.addEventListener("dragover", (e) => { handleFolderDragOver(e, folderId, currentMode, dropValue); });
                wrapper.addEventListener("drop", (e) => {
                    e.stopPropagation(); counter = 0; wrapper.classList.remove("meta-drop-hover"); clearTimeout(dragExpandTimer);
                    if (dropValue !== null && dropValue !== 'group_disabled' && dropValue !== 'subject_disabled') dropToMetaCategory(e, currentMode, dropValue, wrapper);
                });

                const isOpen = drawerFolderStates[folderId];
                wrapper.innerHTML = `
                    <div class="folder-header flex items-center justify-between p-1.5 md:p-2 cursor-pointer hover:bg-black/5 dark:hover:bg-white/5 rounded-lg group select-none transition-colors" onclick="toggleFolder(this)" ${contextMenuAttr} data-folder-id="${folderId}">
                        <div class="flex items-center gap-2 min-w-0" style="color: ${iconColor}">
                            <span class="material-symbols-outlined text-[18px] folder-icon flex-shrink-0 transition-transform ${isOpen ? 'open' : ''}">chevron_right</span>
                            <span class="text-[11px] md:text-xs font-bold truncate">${title}</span>
                        </div>
                        <div class="flex items-center gap-0.5 flex-shrink-0 text-[var(--md-sys-color-on-surface)]">${extraHtml}</div>
                    </div>
                    <div class="folder-content ${isOpen ? 'open' : ''}"><div class="folder-inner"><div class="flex flex-col gap-1 px-1 pb-1 pt-0.5 target-inner" style="margin-left: 14px; border-left: 1px solid var(--md-sys-color-outline-variant); padding-left: 8px;"></div></div></div>
                `;
                return wrapper;
            }

            const standardFolderColor = 'var(--md-sys-color-primary)';
            if (currentMode === 'starred') {
                const starredItems = [];
                appState.batches.forEach(b => { b.subtasks.forEach(s => { if (s.starred) starredItems.push({ batch: b, subtask: s }); }); });
                const folderId = 'starred_all_tasks';
                if (drawerFolderStates[folderId] === undefined) drawerFolderStates[folderId] = true;
                const folder = createFolderDom(`重要任务 <span class="text-[10px] font-normal text-[var(--md-sys-color-outline)] ml-1">(${starredItems.length})</span>`, null, '', '', 'var(--md-sys-color-gold)', folderId);
                const inner = folder.querySelector('.target-inner');
                if (starredItems.length === 0) inner.innerHTML = `<div class="text-[10px] text-[var(--md-sys-color-outline)] p-3 text-center border border-dashed rounded-lg border-[var(--md-sys-color-outline-variant)]">暂无星标重要任务<br/>鼠标悬浮在任务上点击 ☆ 即可设为重要</div>`;
                else starredItems.forEach(item => { renderDrawerTask(item, '重要', inner); });
                container.appendChild(folder); return;
            }

            if (currentMode === 'time') {
                const timeTree = { unassigned: [], years: {} };
                appState.batches.forEach(b => b.subtasks.forEach(s => {
                    if (!s.endDate) timeTree.unassigned.push({ batch: b, subtask: s });
                    else {
                        const d = new Date(s.endDate);
                        if (isNaN(d.getTime())) return;
                        const y = d.getFullYear(), m = d.getMonth() + 1, w = getWeekNumberInMonth(s.endDate);
                        const dayStr = s.endDate, wd = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"][d.getDay()];
                        if (!timeTree.years[y]) timeTree.years[y] = {};
                        if (!timeTree.years[y][m]) timeTree.years[y][m] = {};
                        if (!timeTree.years[y][m][w]) timeTree.years[y][m][w] = {};
                        if (!timeTree.years[y][m][w][dayStr]) timeTree.years[y][m][w][dayStr] = { wd, items: [] };
                        timeTree.years[y][m][w][dayStr].items.push({ batch: b, subtask: s });
                    }
                }));

                if (timeTree.unassigned.length > 0) {
                    const unassignedFolder = createFolderDom(`待排程 (${timeTree.unassigned.length})`, '待排程', '', '', standardFolderColor, 'time_unassigned');
                    timeTree.unassigned.forEach(item => renderDrawerTask(item, '待排程', unassignedFolder.querySelector('.target-inner')));
                    container.appendChild(unassignedFolder);
                }
                Object.keys(timeTree.years).sort((a, b) => b - a).forEach(y => {
                    const yFolder = createFolderDom(`${y}年`, null, '', '', standardFolderColor, `time_y_${y}`);
                    Object.keys(timeTree.years[y]).sort((a, b) => b - a).forEach(m => {
                        const mFolder = createFolderDom(`${m}月`, null, '', '', standardFolderColor, `time_m_${y}_${m}`);
                        Object.keys(timeTree.years[y][m]).sort((a, b) => b - a).forEach(w => {
                            const wFolder = createFolderDom(`第${w}周`, null, '', '', standardFolderColor, `time_w_${y}_${m}_${w}`);
                            Object.keys(timeTree.years[y][m][w]).sort((a, b) => b.localeCompare(a)).forEach(dayStr => {
                                const dayData = timeTree.years[y][m][w][dayStr];

        function getWeekNumberInMonth(dateStr) {
            const d = new Date(dateStr);
            const firstDay = new Date(d.getFullYear(), d.getMonth(), 1);
            const pastDays = d.getDate() + (firstDay.getDay() === 0 ? 7 : firstDay.getDay()) - 1;
            return Math.ceil(pastDays / 7);
        }

        function focusDayTimeline(centerDateStr) {
            if (appState.calendarMode !== 'week') return;
            document.getElementById("timeline-focused-title").innerHTML = `<span class="material-symbols-outlined text-sm">schedule</span> ${centerDateStr.substring(5)} 时间轴`;
            const prevDateStr = getAdjacentDateStr(centerDateStr, -1);
            const nextDateStr = getAdjacentDateStr(centerDateStr, 1);
            renderTimelinePaneContent("slider-pane-prev", prevDateStr);
            renderTimelinePaneContent("slider-pane-current", centerDateStr);
            renderTimelinePaneContent("slider-pane-next", nextDateStr);
        }

        function getAdjacentDateStr(baseDateStr, delta) {
            const d = new Date(baseDateStr); d.setDate(d.getDate() + delta);
            return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().split('T')[0];
        }

        function renderTimelinePaneContent(paneId, dateStr) {
            const pane = document.getElementById(paneId);
            if (!pane) return;
            pane.innerHTML = "";
            const container = document.createElement("div");
            container.className = "timeline-track-container w-full relative"; container.id = `timeline-track-${paneId}`;
            container.addEventListener("dragover", allowDrop); container.addEventListener("drop", dropToTimelineTrack);

            const bgTrack = document.createElement("div"); bgTrack.className = "absolute inset-0 z-0 pointer-events-none";
            for (let h = 0; h < 24; h++) {
                const row = document.createElement("div");
                row.className = "timeline-hour-row flex items-start pl-10 md:pl-12 pt-1 border-[var(--md-sys-color-outline-variant)]";
                row.innerHTML = `<span class="absolute left-1 md:left-2 text-[9px] md:text-[10px] font-mono text-[var(--md-sys-color-outline)] font-bold">${h < 10 ? '0' + h : h}:00</span>`;
                bgTrack.appendChild(row);
            }
            container.appendChild(bgTrack);

            const cardPool = document.createElement("div"); cardPool.className = "absolute top-0 bottom-0 left-12 md:left-14 right-2 md:right-4 z-10";
            let dayTasks = [];
            appState.batches.forEach(b => b.subtasks.forEach(s => {
                if (s.endDate === dateStr && s.startMinute !== null && s.startMinute !== undefined) dayTasks.push({ batch: b, subtask: s });
            }));
            dayTasks.sort((a, b) => a.subtask.startMinute - b.subtask.startMinute);

            let overlapGroups = [];
            dayTasks.forEach(task => {
                let placed = false;
                for (let group of overlapGroups) {
                    let overlaps = group.some(other => {
                        const s1 = task.subtask.startMinute, e1 = s1 + task.subtask.durationMinutes;
                        const s2 = other.subtask.startMinute, e2 = s2 + other.subtask.durationMinutes;
                        return Math.max(s1, s2) < Math.min(e1, e2);
                    });
                    if (overlaps) { group.push(task); task.colIndex = group.length - 1; placed = true; break; }
                }
                if (!placed) { task.colIndex = 0; overlapGroups.push([task]); }
            });
            overlapGroups.forEach(group => group.forEach(t => t.groupTotal = group.length));

            dayTasks.forEach(item => {
                const { batch, subtask } = item;
                const topPx = subtask.startMinute, heightPx = subtask.durationMinutes;
                const widthPct = 100 / item.groupTotal, leftPct = item.colIndex * widthPct;
                const block = document.createElement("div"); block.id = `tl-sub-${subtask.id}`;
                const starBorder = subtask.starred ? 'border-2 border-amber-400 shadow-amber-400/30' : 'border border-white/20';
                block.className = `absolute rounded-xl p-1.5 md:p-2.5 text-[10px] md:text-xs text-white font-bold shadow-md select-none group flex flex-col ${starBorder} transition-all active:scale-[0.99] active:shadow-lg ${subtask.done ? 'opacity-60 saturate-50 line-through' : ''}`;
                block.style.top = `${topPx}px`; block.style.height = `${heightPx}px`; block.style.left = `calc(${leftPct}% + 2px)`; block.style.width = `calc(${widthPct}% - 4px)`;
                block.style.backgroundColor = subjectColors[batch.subject]?.text || "var(--md-sys-color-primary)";
                let startH = String(Math.floor(subtask.startMinute / 60)).padStart(2, '0'), startM = String(subtask.startMinute % 60).padStart(2, '0');
                block.innerHTML = `
                    <div class="flex-1 overflow-hidden pointer-events-none">
                        <div class="truncate flex items-center justify-between"><span class="truncate">${subtask.text}</span>${subtask.starred ? '<span class="material-symbols-outlined star-filled text-sm ml-1 flex-shrink-0">grade</span>' : ''}</div>
                        <div class="text-[9px] md:text-[10px] opacity-90 font-mono mt-0.5 font-normal tracking-wide ${subtask.done ? 'hidden' : ''}">${startH}:${startM} (${subtask.durationMinutes}m)</div>
                    </div>
                    <div class="resize-handle" onmousedown="startTimelineResize(event, '${subtask.id}')" ontouchstart="startTimelineResize(event, '${subtask.id}')">
                        <div class="w-6 md:w-8 h-1 bg-white/40 rounded-full mx-auto mt-1 pointer-events-none group-hover:bg-white/80 transition-colors"></div>
                    </div>
                `;

                block.addEventListener("mousedown", (e) => { if (!e.target.closest('.resize-handle')) startTimelineCardDrag(e, subtask.id); });
                block.addEventListener("touchstart", (e) => { if (!e.target.closest('.resize-handle')) startTimelineCardDrag(e, subtask.id); }, { passive: false });
                let timer;
                block.addEventListener("touchstart", (e) => { timer = setTimeout(() => handleContextMenu(e, 'task_calendar', batch.id, subtask.id), 500); });
                block.addEventListener("touchend", () => clearTimeout(timer)); block.addEventListener("touchmove", () => clearTimeout(timer));
                block.addEventListener("contextmenu", (e) => handleContextMenu(e, 'task_calendar', batch.id, subtask.id));
                block.addEventListener("mousemove", (e) => showGlobalTooltip(e, subtask.id)); block.addEventListener("mouseleave", hideGlobalTooltip);
                cardPool.appendChild(block);
            });
            container.appendChild(cardPool); pane.appendChild(container);
        }

        function toggleModal(isOpen) {

                backdrop.classList.remove('pointer-events-none', 'opacity-0'); backdrop.classList.add('opacity-100', 'pointer-events-auto');
                modal?.classList.replace('scale-90', 'scale-100');
            } else {
                modal?.classList.replace('scale-100', 'scale-90');
                backdrop.classList.remove('opacity-100', 'pointer-events-auto'); backdrop.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        function openAddTaskModal() {
            document.getElementById("modal-form-title").innerText = "创建新任务"; document.getElementById("form-task-id").value = "";
            document.getElementById("form-subject-container").innerHTML = appState.subjects.map(sub =>
                `<button type="button" onclick="selectFormSubject('${sub}')" id="form-sub-${sub}" class="px-3.5 py-1.5 rounded-full text-[11px] font-bold border border-[var(--md-sys-color-outline-variant)] transition-all hover:bg-black/5 ${appState.selectedFormSubject === sub ? 'chip-active shadow-sm' : 'text-[var(--md-sys-color-on-surface-variant)]'}">${sub}</button>`
            ).join('');
            appState.selectedFormTags = []; renderFormTagsPool(); document.getElementById("task-form").reset(); document.getElementById("form-checklist-slots").innerHTML = ""; toggleModal(true);
        }

        function openEditTaskModal(batchId) {
            const batch = appState.batches.find(b => b.id === batchId); if (!batch) return;
            openAddTaskModal();
            document.getElementById("modal-form-title").innerText = "编辑任务"; document.getElementById("form-task-id").value = batch.id;
            document.getElementById("form-title").value = batch.title; document.getElementById("form-content").value = batch.content;
            selectFormSubject(batch.subject);
            const box = document.getElementById("form-checklist-slots"); box.innerHTML = "";
            batch.subtasks.forEach(sub => {
                const div = document.createElement("div"); div.className = "flex gap-2 items-center group";
                div.dataset.subId = sub.id; div.dataset.endDate = sub.endDate || ""; div.dataset.starred = sub.starred ? "true" : "false";
                div.dataset.startMinute = sub.startMinute === null ? "null" : sub.startMinute; div.dataset.durationMinutes = sub.durationMinutes || 120;
                div.innerHTML = `
                    <input type="text" value="${sub.text}" required class="flex-1 p-2 rounded-lg border text-xs bg-[var(--md-sys-color-surface-container-lowest)] outline-none focus:border-[var(--md-sys-color-primary)] transition-colors checklist-text-input" onkeydown="if(event.key==='Enter'){event.preventDefault(); addChecklistItemSlot(this);}" />
                    <div class="flex items-center gap-1 w-20"><span class="text-[10px] text-[var(--md-sys-color-outline)]">权重</span><input type="number" min="1" value="${sub.weight || 1}" class="w-full p-1.5 rounded-lg border text-xs bg-[var(--md-sys-color-surface-container-lowest)] border-[var(--md-sys-color-outline-variant)] outline-none focus:border-[var(--md-sys-color-primary)] transition-colors checklist-weight-input" /></div>
                    <button type="button" onclick="this.parentElement.remove()" class="text-[var(--md-sys-color-outline)] hover:text-red-500 transition-colors p-1"><span class="material-symbols-outlined text-lg">do_not_disturb_on</span></button>
                `;
                box.appendChild(div);
            });
            appState.selectedFormTags = [...batch.tags]; renderFormTagsPool();
        }

        function closeAddTaskModal() { toggleModal(false); }

        function renderFormTagsPool() {
            const container = document.getElementById("form-tags-list");
            let html = appState.tags.map(t => {
                const isSel = appState.selectedFormTags.includes(t.name);
                return `<button type="button" onclick="toggleFormTagSelection('${t.name}')" class="px-3 py-1 rounded-full text-[10px] font-bold shadow-sm border border-transparent transition-transform active:scale-95" style="background-color: ${isSel ? t.color : 'var(--md-sys-color-surface-variant)'}; color: ${isSel ? '#FFF' : 'var(--md-sys-color-on-surface-variant)'};">${t.name}</button>`;
            }).join('');
            html += `<button type="button" onclick="showAddTagUI()" id="btn-show-add-tag" class="px-3 py-1 rounded-full text-[10px] font-bold border border-dashed border-[var(--md-sys-color-outline)] text-[var(--md-sys-color-outline)] hover:bg-black/5 dark:hover:bg-white/5 flex items-center gap-1 transition-colors"><span class="material-symbols-outlined text-[14px]">add</span>新建</button>`;
            html += `<div id="new-tag-ui" class="hidden items-center gap-1.5 bg-[var(--md-sys-color-surface-container-highest)] px-2 py-1 rounded-full border border-[var(--md-sys-color-outline-variant)] shadow-inner w-full sm:w-auto mt-1 sm:mt-0">
                <input type="color" id="new-tag-color-input" value="#6750A4" class="w-5 h-5 rounded cursor-pointer border-0 bg-transparent p-0 flex-shrink-0">
                <input type="text" id="new-tag-name-input" placeholder="标签名..." class="w-20 sm:w-24 bg-transparent text-[11px] font-bold outline-none text-[var(--md-sys-color-on-surface)] placeholder-gray-400">
                <button type="button" onclick="saveNewTag()" class="text-[var(--md-sys-color-primary)] hover:brightness-110 flex items-center p-0.5"><span class="material-symbols-outlined text-[16px]">check_circle</span></button>
                <button type="button" onclick="hideAddTagUI()" class="text-[var(--md-sys-color-outline)] hover:text-red-500 flex items-center p-0.5"><span class="material-symbols-outlined text-[16px]">cancel</span></button>
            </div>`;
            container.innerHTML = html;
        }

        function showAddTagUI() { document.getElementById('btn-show-add-tag').classList.add('hidden'); document.getElementById('new-tag-ui').classList.remove('hidden'); document.getElementById('new-tag-ui').classList.add('flex'); document.getElementById('new-tag-name-input').focus(); }
        function hideAddTagUI() { document.getElementById('btn-show-add-tag').classList.remove('hidden'); document.getElementById('new-tag-ui').classList.add('hidden'); document.getElementById('new-tag-ui').classList.remove('flex'); }
        function saveNewTag() {
            const name = document.getElementById('new-tag-name-input').value.trim(); const color = document.getElementById('new-tag-color-input').value;
            if (!name) { alert('请输入标签名'); return; }
            if (appState.tags.some(t => t.name === name)) { alert('标签已存在'); return; }
            appState.tags.push({ name, color }); appState.selectedFormTags.push(name); saveStateToStorage(); renderFormTagsPool();
            if (appState.currentDrawerArrange === 'tag') renderLeftDrawerPool();
        }
        function toggleFormTagSelection(tagName) { appState.selectedFormTags = appState.selectedFormTags.includes(tagName) ? appState.selectedFormTags.filter(t => t !== tagName) : [...appState.selectedFormTags, tagName]; renderFormTagsPool(); }
        function selectFormSubject(sub) {
            appState.selectedFormSubject = sub;
            document.querySelectorAll("#form-subject-container button").forEach(b => { b.classList.remove("chip-active", "shadow-sm"); b.classList.add("text-[var(--md-sys-color-on-surface-variant)]"); });
            const el = document.getElementById(`form-sub-${sub}`);
            if (el) { el.classList.add("chip-active", "shadow-sm"); el.classList.remove("text-[var(--md-sys-color-on-surface-variant)]"); }
        }

        function addChecklistItemSlot(currentInput = null) {
            const box = document.getElementById("form-checklist-slots"); const div = document.createElement("div");
            div.className = "flex gap-2 items-center group";
            div.innerHTML = `
                <input type="text" placeholder="如：数学暑假作业卷一" required class="flex-1 p-2.5 rounded-xl border text-xs bg-[var(--md-sys-color-surface-container-lowest)] border-[var(--md-sys-color-outline-variant)] outline-none focus:border-[var(--md-sys-color-primary)] transition-colors checklist-text-input" onkeydown="if(event.key==='Enter'){event.preventDefault(); addChecklistItemSlot(this);}" />
                <div class="flex items-center gap-1 w-20"><span class="text-[10px] text-[var(--md-sys-color-outline)]">权重</span><input type="number" min="1" value="1" class="w-full p-1.5 rounded-lg border text-xs bg-[var(--md-sys-color-surface-container-lowest)] border-[var(--md-sys-color-outline-variant)] outline-none focus:border-[var(--md-sys-color-primary)] transition-colors checklist-weight-input" /></div>
                <button type="button" onclick="this.parentElement.remove()" class="text-[var(--md-sys-color-outline)] hover:text-red-500 transition-colors p-1"><span class="material-symbols-outlined text-lg">do_not_disturb_on</span></button>
            `;
            if (currentInput && currentInput.parentElement) currentInput.parentElement.after(div); else box.appendChild(div);
            setTimeout(() => div.querySelector('.checklist-text-input').focus(), 50);
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const bId = document.getElementById("form-task-id").value, title = document.getElementById("form-title").value.trim(), content = document.getElementById("form-content").value.trim();
            const originalBatch = bId ? appState.batches.find(b => b.id === bId) : null;
            const subtasks = [];
            document.querySelectorAll("#form-checklist-slots > div").forEach((div, idx) => {
                const text = div.querySelector(".checklist-text-input").value.trim(); const weight = parseInt(div.querySelector(".checklist-weight-input")?.value) || 1;
                if (text) {
                    let doneStatus = false, isStarred = false, compAt = null;
                    if (div.dataset.subId && originalBatch) {
                        const originalSub = originalBatch.subtasks.find(s => s.id === div.dataset.subId);
                        if (originalSub) { doneStatus = originalSub.done; isStarred = !!originalSub.starred; compAt = originalSub.completedAt; }
                    }
                    subtasks.push({
                        id: div.dataset.subId || `sub-${Date.now()}-${idx}`, text: text, weight: weight, done: doneStatus, starred: isStarred, completedAt: compAt,
                        endDate: div.dataset.endDate || null, startMinute: (div.dataset.startMinute !== "null" && div.dataset.startMinute !== undefined) ? parseInt(div.dataset.startMinute) : 480, durationMinutes: parseInt(div.dataset.durationMinutes) || 120
                    });
                }
            });
            if (bId) {
                const existing = appState.batches.find(b => b.id === bId);
                if (existing) { existing.title = title; existing.content = content; existing.subject = appState.selectedFormSubject; existing.tags = [...appState.selectedFormTags]; existing.subtasks = subtasks; }
            } else { appState.batches.unshift({ id: `batch-${Date.now()}`, title, content, subject: appState.selectedFormSubject, tags: [...appState.selectedFormTags], subtasks }); }
            saveStateToStorage(); closeAddTaskModal(); renderAllComponents();
        }

        function calculateAndRenderStatistics() {
            let totalWeight = 0, completedWeight = 0, totalItems = 0;
            appState.batches.forEach(b => b.subtasks.forEach(s => { const w = s.weight || 1; totalItems++; totalWeight += w; if (s.done) completedWeight += w; }));
            const percent = totalWeight === 0 ? 0 : Math.round((completedWeight / totalWeight) * 100);
            document.getElementById("global-progress-percent").innerText = `${percent}%`; document.getElementById("global-progress-bar").style.width = `${percent}%`;
            document.getElementById("stats-summary-text").innerText = `共 ${appState.batches.length} 门学科， ${totalItems} 项子任务。`;
        }

        function renderSpecialTaskLists() {
            const overdue = document.getElementById("overdue-tasks-container"), today = document.getElementById("today-tasks-container");
            if (!overdue || !today) return;
            overdue.innerHTML = ""; today.innerHTML = "";
            appState.batches.forEach(b => {
                b.subtasks.forEach(s => {
                    if (s.endDate) {
                        const isOverdue = s.endDate < TODAY_STR, isToday = s.endDate === TODAY_STR;
                        if (isOverdue && s.done && (!s.completedAt || s.completedAt < TODAY_STR)) return;
                        if (!isOverdue && !isToday) return;

                        const item = document.createElement("div"); item.id = `today-item-${s.id}`; item.setAttribute("draggable", "true");
                        item.addEventListener("dragstart", (e) => handleSubtaskDragStart(e, s.id));
                        let baseClass = "group/today p-2 rounded-lg bg-[var(--md-sys-color-surface-container-lowest)] text-xs font-medium shadow-sm cursor-pointer hover:bg-black/5 flex items-center justify-between gap-2 transition-colors";
                        if (s.done) baseClass += " line-through opacity-50 saturate-50";
                        item.className = `${baseClass} ${isOverdue ? "border-l-4 border-rose-500" : isToday ? "border-l-4 border-[var(--md-sys-color-primary)]" : ""}`;
                        const checkboxClass = isOverdue ? "w-4 h-4 appearance-none rounded border-2 border-[var(--md-sys-color-outline)] checked:border-rose-500 checked:bg-rose-500 transition-colors peer cursor-pointer" : "w-4 h-4 appearance-none rounded border-2 border-[var(--md-sys-color-outline)] checked:border-[var(--md-sys-color-primary)] checked:bg-[var(--md-sys-color-primary)] transition-colors peer cursor-pointer";

                        item.addEventListener("contextmenu", (e) => handleContextMenu(e, 'task_today', b.id, s.id));
                        item.addEventListener("click", (e) => {
                            if (e.target.tagName.toLowerCase() === 'input' || e.target.tagName.toLowerCase() === 'button' || e.target.closest('button')) return;
                            expandToDrawerTask(s.id);
                        });

                        const starIconClass = s.starred ? 'star-filled opacity-100' : 'star-outline opacity-0 group-hover/today:opacity-100 hover:text-amber-500';
                        item.innerHTML = `
                            <div class="flex items-center gap-2 flex-1 min-w-0">
                                <div class="relative flex items-center justify-center flex-shrink-0" onclick="event.stopPropagation()">
                                    <input type="checkbox" ${s.done ? 'checked' : ''} onchange="toggleSubtaskStatus('${s.id}')" class="${checkboxClass}" />
                                    <span class="material-symbols-outlined text-[14px] text-white absolute opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity font-bold">check</span>
                                </div>
                                <div class="flex-1 min-w-0 flex flex-col gap-0.5">
                                    <span class="truncate block ${isOverdue ? 'text-rose-700 dark:text-rose-400' : 'text-[var(--md-sys-color-primary)]'}">${s.text}</span>
                                    ${isOverdue ? `<span class="text-[9px] text-rose-500 font-mono bg-rose-500/10 px-1 py-0.5 rounded w-max">截止日期: ${s.endDate}</span>` : ''}
                                </div>
                            </div>
                            <button type="button" onclick="toggleSubtaskStar('${s.id}', event, this)" class="text-[18px] flex items-center justify-center transition-all p-0.5 rounded-full hover:bg-amber-500/10 flex-shrink-0"><span class="material-symbols-outlined text-[18px] ${starIconClass}">grade</span></button>
                        `;
                        if (isOverdue) overdue.appendChild(item); else if (isToday) today.appendChild(item);
                    }
                });
            });
            if (!overdue.children.length) overdue.innerHTML = `<div class="text-[10px] text-emerald-500 text-center py-2 font-bold bg-emerald-500/10 rounded-lg">计划内无滞留！</div>`;
            if (!today.children.length) today.innerHTML = `<div class="text-[11px] text-[var(--md-sys-color-outline)] text-center py-4 border border-dashed rounded-lg border-[var(--md-sys-color-outline-variant)]">今日无安排</div>`;
        }

        function toggleSubtaskStatus(subtaskId) {
            const target = findSubtask(subtaskId);
            if (target) { target.subtask.done = !target.subtask.done; target.subtask.completedAt = target.subtask.done ? TODAY_STR : null; saveStateToStorage(); renderAllComponents(); }
        }

        function deleteEntireBatch(id) { appState.batches = appState.batches.filter(b => b.id !== id); saveStateToStorage(); renderAllComponents(); }
        function handleSearchDebounced(val) { clearTimeout(searchDebounceTimer); searchDebounceTimer = setTimeout(() => { appState.searchQuery = val.trim(); renderHomeChecklist(); }, 200); }

        function switchView(viewName) {
            document.querySelectorAll('.md-nav-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.view-pane').forEach(pane => pane.classList.remove('active'));
            document.getElementById(`nav-${viewName}`)?.classList.add('active'); document.getElementById(`view-${viewName}`)?.classList.add('active');
            if (viewName === 'calendar') switchCalendarMode('month');
            if (viewName === 'today') { document.getElementById("today-date-display").innerText = TODAY_STR; renderSpecialTaskLists(); }
        }

        function toggleDrawer() { const drawer = document.getElementById('task-drawer'); drawer.classList.toggle('collapsed'); document.getElementById('drawer-restore-btn').classList.toggle('hidden', !drawer.classList.contains('collapsed')); }

        function toggleDarkMode(manual = false) {
            const isDark = document.documentElement.classList.toggle("dark");
            if (manual) localStorage.setItem("THEME_DARK_MODE", isDark ? "true" : "false");
            document.getElementById("dark-mode-icon").innerText = isDark ? "light_mode" : "dark_mode";
        }

        function initializeTheme() {
            const isDarkSystem = window.matchMedia('(prefers-color-scheme: dark)').matches; const savedTheme = localStorage.getItem("THEME_DARK_MODE");
            const isDark = savedTheme !== null ? savedTheme === "true" : isDarkSystem;
            document.documentElement.classList.toggle("dark", isDark); document.getElementById("dark-mode-icon").innerText = isDark ? "light_mode" : "dark_mode";
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                if (localStorage.getItem("THEME_DARK_MODE") === null) { document.documentElement.classList.toggle("dark", e.matches); document.getElementById("dark-mode-icon").innerText = e.matches ? "light_mode" : "dark_mode"; }
            });
        }

        function triggerDataExport() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
            const anchor = document.createElement('a'); anchor.setAttribute("href", dataStr); anchor.setAttribute("download", `MD3_ATOMIC_DATA.json`); anchor.click(); anchor.remove();
        }
        function triggerDataImport(e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function (evt) {
                try { const data = JSON.parse(evt.target.result); if (data.batches) { appState = data; saveStateToStorage(); renderAllComponents(); alert("配置复原成功！"); } }
                catch (err) { alert("非法配置文件。"); }
            }; reader.readAsText(file);
        }

        function renderAllComponents() { calculateAndRenderStatistics(); renderHomeChecklist(); renderLeftDrawerPool(); renderSpecialTaskLists(); updateCalendarTaskRendering(); }
    </script>
</body>

</html>
