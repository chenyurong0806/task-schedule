<!DOCTYPE html>
<html lang="zh-CN" class="transition-colors duration-300">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>任务看板</title>
    <meta name="theme-color" content="#6750A4">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {extend: {}}
        }
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />
    <link rel="icon" type="image/png" href="icon.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --md-sys-color-primary: #6750A4;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-primary-container: #EADDFF;
            --md-sys-color-on-primary-container: #21005D;
            --md-sys-color-secondary: #625B71;
            --md-sys-color-on-secondary: #FFFFFF;
            --md-sys-color-secondary-container: #E8DEF8;
            --md-sys-color-on-secondary-container: #1D192B;
            --md-sys-color-background: #FEF7FF;
            --md-sys-color-on-background: #1D1B20;
            --md-sys-color-surface: #FEF7FF;
            --md-sys-color-on-surface: #1D1B20;
            --md-sys-color-surface-variant: #E7E0EC;
            --md-sys-color-on-surface-variant: #49454F;
            --md-sys-color-surface-container-lowest: #FFFFFF;
            --md-sys-color-surface-container-low: #F7F2FA;
            --md-sys-color-surface-container: #F3EDF7;
            --md-sys-color-surface-container-high: #ECE6F0;
            --md-sys-color-surface-container-highest: #E6E1E5;
            --md-sys-color-outline: #79747E;
            --md-sys-color-outline-variant: #CAC4D0;
            --md-sys-color-tertiary-container: #FFD8E4;
            --md-sys-color-gold: #F59E0B;
            --md-motion-easing-emphasized: cubic-bezier(0.2, 0, 0, 1);
            --md-motion-easing-standard: cubic-bezier(0.4, 0, 0.2, 1);
            --md-motion-duration-short4: 200ms;
            --md-motion-duration-medium1: 250ms;
            --md-motion-duration-long1: 400ms;
        }

        html.dark {
            --md-sys-color-primary: #D0BCFF;
            --md-sys-color-on-primary: #381E72;
            --md-sys-color-primary-container: #4F378B;
            --md-sys-color-on-primary-container: #EADDFF;
            --md-sys-color-secondary: #CCC2DC;
            --md-sys-color-on-secondary: #332D41;
            --md-sys-color-secondary-container: #4A4458;
            --md-sys-color-on-secondary-container: #E8DEF8;
            --md-sys-color-background: #141218;
            --md-sys-color-on-background: #E6E1E5;
            --md-sys-color-surface: #141218;
            --md-sys-color-on-surface: #E6E1E5;
            --md-sys-color-surface-variant: #49454F;
            --md-sys-color-on-surface-variant: #CAC4D0;
            --md-sys-color-surface-container-lowest: #0F0D13;
            --md-sys-color-surface-container-low: #1D1B20;
            --md-sys-color-surface-container: #211F26;
            --md-sys-color-surface-container-high: #2B2930;
            --md-sys-color-surface-container-highest: #333138;
            --md-sys-color-outline: #938F99;
            --md-sys-color-outline-variant: #49454F;
            --md-sys-color-gold: #FBBF24;
        }

        body {
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-background);
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        .material-symbols-outlined.star-filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            color: var(--md-sys-color-gold);
        }

        .material-symbols-outlined.star-outline {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            color: var(--md-sys-color-outline);
        }

        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        @keyframes starPopAnim {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.4) rotate(15deg);
            }

            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        .star-pop {
            animation: starPopAnim 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .md-ripple {
            position: relative;
            overflow: hidden;
        }

        .md-ripple-ink {
            position: absolute;
            border-radius: 50%;
            background-color: currentColor;
            opacity: 0.2;
            transform: scale(0);
            animation: mdRippleEffect 0.55s cubic-bezier(0.2, 0, 0, 1) forwards;
            pointer-events: none;
        }

        @keyframes mdRippleEffect {
            to {
                transform: scale(2.8);
                opacity: 0;
            }
        }

        .md-nav-item .md-icon-wrapper {
            transition: background-color var(--md-motion-duration-short4) var(--md-motion-easing-emphasized), transform 0.2s ease, color 0.2s ease;
        }

        .md-nav-item:hover .md-icon-wrapper {
            background-color: rgba(103, 80, 164, 0.08);
        }

        html.dark .md-nav-item:hover .md-icon-wrapper {
            background-color: rgba(208, 188, 255, 0.12);
        }

        .md-nav-item.active .md-icon-wrapper {
            background-color: var(--md-sys-color-secondary-container) !important;
            color: var(--md-sys-color-on-secondary-container) !important;
            border-radius: 16px;
        }

        #task-drawer {
            transition: width var(--md-motion-duration-long1) var(--md-motion-easing-emphasized),
                opacity var(--md-motion-duration-medium1) var(--md-motion-easing-emphasized),
                transform var(--md-motion-duration-long1) var(--md-motion-easing-emphasized);
            overflow: hidden !important;
        }

        #task-drawer.collapsed {
            width: 0px !important;
            min-width: 0px !important;
            opacity: 0;
            pointer-events: none;
            border-right-width: 0px !important;
        }

        @media (max-width: 767px) {
            #task-drawer.collapsed {
                transform: translateX(-100%);
            }
        }

        #task-drawer-inner {
            width: 20rem;
            min-width: 20rem;
            height: 100%;
        }

        .view-pane {
            opacity: 0;
            transform: translateY(10px);
            transition: opacity var(--md-motion-duration-long1) var(--md-motion-easing-emphasized),
                transform var(--md-motion-duration-long1) var(--md-motion-easing-emphasized);
            pointer-events: none !important;
            position: absolute;
            inset: 0;
            display: none !important;
        }

        .view-pane.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto !important;
            position: relative;
            display: flex !important;
            animation: viewPaneSlideIn 0.3s var(--md-motion-easing-emphasized) forwards;
        }

        @keyframes viewPaneSlideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
        }

        .no-scrollbar::-webkit-scrollbar,
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar,
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .md-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .md-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .md-scrollbar::-webkit-scrollbar-thumb {
            background: var(--md-sys-color-outline-variant);
            border-radius: 8px;
        }

        .md-scrollbar::-webkit-scrollbar-thumb:hover {
            background: var(--md-sys-color-outline);
        }

        .md-scrollbar {
            scrollbar-width: thin;
            scrollbar-color: var(--md-sys-color-outline-variant) transparent;
        }

        .cal-scroll-v {
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
        }

        .cal-scroll-h {
            touch-action: pan-x pan-y;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
        }

        .week-cell {
            transition: flex-grow 0.35s var(--md-motion-easing-emphasized), min-width 0.35s var(--md-motion-easing-emphasized), background-color 0.2s;
        }

        .week-cell-active {
            flex: 3 1 0%;
            min-width: 280px !important;
        }

        .week-cell-inactive {
            flex: 1 1 0%;
            min-width: 170px !important;
        }

        .chip-active {
            background-color: var(--md-sys-color-secondary-container) !important;
            color: var(--md-sys-color-on-secondary-container) !important;
            border-color: transparent !important;
        }

        .drag-hover {
            background-color: var(--md-sys-color-primary-container) !important;
            opacity: 0.85;
            transform: scale(1.02);
            box-shadow: 0 0 0 2px var(--md-sys-color-primary) inset;
            border-radius: 8px;
        }

        .meta-drop-hover {
            background-color: var(--md-sys-color-tertiary-container) !important;
            transform: scale(1.02);
            border: 1px dashed var(--md-sys-color-primary) !important;
            z-index: 10;
            position: relative;
        }

        .timeline-track-container {
            position: relative;
            height: 1440px;
        }

        .timeline-hour-row {
            height: 60px;
            border-bottom: 1px dashed var(--md-sys-color-outline-variant);
            position: relative;
        }

        .resize-handle {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 12px;
            cursor: ns-resize;
            background-color: rgba(0, 0, 0, 0.12);
            border-radius: 0 0 8px 8px;
            touch-action: none;
        }

        .resize-handle:hover {
            background-color: rgba(0, 0, 0, 0.3);
        }

        #global-tooltip {
            position: fixed;
            pointer-events: none;
            z-index: 350;
            display: none;
            box-shadow: 0px 4px 16px rgba(0, 0, 0, 0.15);
            background-color: var(--md-sys-color-surface-container-highest);
            color: var(--md-sys-color-on-surface);
            border-radius: 12px;
            padding: 12px;
            max-width: 280px;
            border: 1px solid var(--md-sys-color-outline-variant);
        }

        .folder-content {
            transition: grid-template-rows var(--md-motion-duration-long1) var(--md-motion-easing-emphasized);
            display: grid;
            grid-template-rows: 0fr;
        }

        .folder-content.open {
            grid-template-rows: 1fr;
        }

        .folder-inner {
            overflow: hidden;
            min-height: 0;
            padding: 0 !important;
            border: none !important;
        }

        .batch-card {
            transition: transform 0.3s var(--md-motion-easing-emphasized), box-shadow 0.3s var(--md-motion-easing-emphasized), border-color 0.3s ease;
        }

        .home-batch-content {
            transition: grid-template-rows 0.45s var(--md-motion-easing-emphasized), opacity 0.35s var(--md-motion-easing-emphasized);
            display: grid;
            grid-template-rows: 1fr;
            opacity: 1;
        }

        .home-batch-content.collapsed {
            grid-template-rows: 0fr;
            opacity: 0;
        }

        .home-batch-content .subtask-item-animated {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.35s var(--md-motion-easing-emphasized), transform 0.35s var(--md-motion-easing-emphasized);
        }

        .home-batch-content.collapsed .subtask-item-animated {
            opacity: 0;
            transform: translateY(-8px);
        }

        .folder-icon {
            transition: transform var(--md-motion-duration-short4) var(--md-motion-easing-standard);
            transform: rotate(0deg);
        }

        .folder-icon.open {
            transform: rotate(90deg);
        }

        .batch-expand-icon {
            transition: transform 0.4s var(--md-motion-easing-emphasized);
        }

        .batch-expand-icon.collapsed {
            transform: rotate(-90deg);
        }

        .md3-progress-smooth {
            transition: width 0.6s var(--md-motion-easing-emphasized);
        }

        @keyframes locatePulse {
            0% {
                box-shadow: 0 0 0 0 rgba(103, 80, 164, 0.8);
            }

            40% {
                box-shadow: 0 0 0 4px rgba(103, 80, 164, 0.4);
            }

            70% {
                box-shadow: 0 0 0 8px rgba(103, 80, 164, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(103, 80, 164, 0);
            }
        }

        .locate-highlight {
            animation: locatePulse 1s ease-in-out 2;
        }

        .slider-track {
            display: flex;
            width: 300%;
            height: 100%;
            transform: translateX(-33.3333%);
            will-change: transform;
        }

        .slider-pane {
            width: 33.3333%;
            height: 100%;
            flex-shrink: 0;
        }

        .starred-calendar-item {
            border: 1.5px solid var(--md-sys-color-gold) !important;
            box-shadow: 0 0 6px rgba(245, 158, 11, 0.4);
        }

        .md3-menu-popup {
            box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.15), 0 4px 12px -2px rgba(0, 0, 0, 0.08);
            border-radius: 16px;
            background-color: var(--md-sys-color-surface-container-high);
            border: 1px solid var(--md-sys-color-outline-variant);
            animation: md3MenuOpen 0.2s var(--md-motion-easing-emphasized) forwards;
            transform-origin: top left;
            box-sizing: border-box;
            line-height: normal;
        }

        .md3-menu-popup button {
            line-height: 1.25rem !important;
            flex-shrink: 0 !important;
            white-space: nowrap;
        }

        @keyframes md3MenuOpen {
            from {
                opacity: 0;
                transform: scale(0.92);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body class="h-[100dvh] w-screen flex flex-col md:flex-row select-none overflow-hidden">

    <div id="global-tooltip" class="text-xs flex flex-col gap-1"></div>

    <!-- MD3 上下文操作菜单 -->
    <div id="custom-context-menu"
        class="fixed hidden z-[300] p-1.5 text-xs min-w-[160px] md3-menu-popup flex-col gap-0.5">
    </div>

    <!-- MD3 日期快速菜单 -->
    <div id="date-quick-menu" class="fixed hidden z-[310] p-1.5 text-xs min-w-[150px] flex-col gap-0.5 md3-menu-popup">
        <button onclick="executeDateAction('today')"
            class="w-full text-left px-3 py-2 rounded-xl hover:bg-black/5 dark:hover:bg-white/5 text-[var(--md-sys-color-on-surface)] flex items-center gap-2.5 font-medium transition-colors md-ripple">
            <span class="material-symbols-outlined text-[18px] text-[var(--md-sys-color-primary)]">today</span>今日完成
        </button>
        <button id="date-quick-menu-custom-btn" onclick="executeDateAction('custom')"
            class="w-full text-left px-3 py-2 rounded-xl hover:bg-black/5 dark:hover:bg-white/5 text-[var(--md-sys-color-on-surface)] flex items-center gap-2.5 font-medium transition-colors md-ripple">
            <span
                class="material-symbols-outlined text-[18px] text-[var(--md-sys-color-secondary)]">edit_calendar</span><span
                id="date-quick-menu-custom-label">设置日期</span>
        </button>
    </div>

    <!-- MD3 日历筛选器下拉弹窗 -->
    <div id="calendar-filter-menu"
        class="fixed hidden z-[260] p-1.5 text-xs min-w-[140px] max-h-60 overflow-y-auto md-scrollbar flex-col gap-1 md3-menu-popup">
    </div>

    <!-- Month Day Detail Modal -->
    <div id="day-detail-modal"
        class="fixed hidden z-[140] w-[280px] sm:w-[320px] rounded-[28px] shadow-2xl flex-col bg-[var(--md-sys-color-surface-container-high)] text-[var(--md-sys-color-on-surface)] border border-[var(--md-sys-color-outline-variant)] transition-all duration-200 opacity-0 scale-95">
        <div id="day-detail-header"
            class="flex justify-between items-center px-4 py-3.5 border-b border-[var(--md-sys-color-outline-variant)] cursor-move rounded-t-[28px] bg-[var(--md-sys-color-surface-container-low)]">
            <div class="flex items-center gap-1.5">
                <button type="button" onclick="navigateDayDetailModal(-1)"
                    class="w-7 h-7 rounded-full flex items-center justify-center hover:bg-black/10 dark:hover:bg-white/10 text-[var(--md-sys-color-on-surface)] transition-colors md-ripple"
                    onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">
                    <span class="material-symbols-outlined text-base">chevron_left</span>
                </button>
                <h3 id="day-detail-date-btn" onclick="openDayDetailDatePicker(event)"
                    class="text-xs sm:text-sm font-bold text-[var(--md-sys-color-primary)] flex items-center gap-1.5 cursor-pointer hover:bg-black/5 dark:hover:bg-white/10 px-2 py-1 rounded-xl transition-colors md-ripple"
                    onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()" title="点击更改日期">
                    <span class="material-symbols-outlined text-base">calendar_today</span>
                    <span id="day-detail-date-title"></span>
                </h3>
                <button type="button" onclick="navigateDayDetailModal(1)"
                    class="w-7 h-7 rounded-full flex items-center justify-center hover:bg-black/10 dark:hover:bg-white/10 text-[var(--md-sys-color-on-surface)] transition-colors md-ripple"
                    onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">
                    <span class="material-symbols-outlined text-base">chevron_right</span>
                </button>
            </div>
            <button type="button" onclick="closeDayDetailModal()"
                class="w-7 h-7 rounded-full flex items-center justify-center hover:bg-black/10 dark:hover:bg-white/10 text-[var(--md-sys-color-on-surface)] transition-colors md-ripple"
                onmousedown="event.stopPropagation()" ontouchstart="event.stopPropagation()">
                <span class="material-symbols-outlined text-base">close</span>
            </button>
        </div>
        <div id="day-detail-tasks"
            class="flex flex-col gap-1.5 p-3 max-h-[300px] overflow-y-auto md-scrollbar rounded-b-[28px]"></div>
    </div>

    <!-- MD3 日期选择器模态框 -->
    <div id="md3-datepicker-modal"
        class="fixed hidden z-[350] w-[280px] sm:w-[300px] rounded-[28px] p-4 shadow-2xl flex-col gap-3 bg-[var(--md-sys-color-surface-container-high)] text-[var(--md-sys-color-on-surface)] border border-[var(--md-sys-color-outline-variant)] transition-all duration-200 transform scale-95 opacity-0">
        <div class="flex flex-col gap-0.5 px-1">
            <span
                class="text-[10px] font-bold tracking-wider uppercase text-[var(--md-sys-color-primary)]">选择排程日期</span>
            <h3 class="text-base font-black text-[var(--md-sys-color-on-surface)]" id="md3-picker-header-date"></h3>
        </div>
        <div class="flex justify-between items-center px-1">
            <span class="text-xs font-bold text-[var(--md-sys-color-on-surface-variant)]"
                id="md3-picker-month-year"></span>
            <div class="flex items-center gap-1">
                <button type="button" onclick="navigateMD3PickerMonth(-1)"
                    class="p-1 rounded-full hover:bg-black/10 dark:hover:bg-white/10 text-[var(--md-sys-color-on-surface)] flex items-center justify-center md-ripple">
                    <span class="material-symbols-outlined text-base">chevron_left</span>
                </button>
                <button type="button" onclick="navigateMD3PickerMonth(1)"
                    class="p-1 rounded-full hover:bg-black/10 dark:hover:bg-white/10 text-[var(--md-sys-color-on-surface)] flex items-center justify-center md-ripple">
                    <span class="material-symbols-outlined text-base">chevron_right</span>
                </button>
            </div>
        </div>
        <div class="grid grid-cols-7 gap-1 text-center text-xs font-bold text-[var(--md-sys-color-on-surface-variant)]">
            <div>日</div>
            <div>一</div>
            <div>二</div>
            <div>三</div>
            <div>四</div>
            <div>五</div>
            <div>六</div>
        </div>
        <div id="md3-picker-days-grid" class="grid grid-cols-7 gap-1 text-center text-xs min-h-[160px]"></div>
        <div class="flex justify-end gap-2 pt-2 border-t border-[var(--md-sys-color-outline-variant)]">
            <button type="button" onclick="closeMD3DatePicker()"
                class="px-3.5 py-1.5 rounded-full text-xs font-bold hover:bg-black/5 dark:hover:bg-white/5 text-[var(--md-sys-color-primary)] transition-colors md-ripple">取消</button>
            <button type="button" onclick="confirmMD3DatePicker(event)"
                class="px-4 py-1.5 rounded-full text-xs font-bold text-[var(--md-sys-color-on-primary)] shadow-sm bg-[var(--md-sys-color-primary)] hover:brightness-110 active:scale-95 transition-all md-ripple">确定</button>
        </div>
    </div>

    <!-- 左侧 / 底部 MD3 导航栏 -->
    <aside
        class="w-full md:w-20 h-16 md:h-full flex flex-row md:flex-col justify-around md:justify-between items-center py-2 md:py-6 flex-shrink-0 order-last md:order-first border-t md:border-t-0 md:border-r z-50 bg-[var(--md-sys-color-surface-container-low)] border-[var(--md-sys-color-outline-variant)] overflow-x-auto no-scrollbar">
        <div class="flex flex-row md:flex-col items-center gap-2 md:gap-5 px-4 md:px-0 w-full md:w-auto">
            <div
                class="hidden md:flex w-12 h-12 rounded-full items-center justify-center text-[var(--md-sys-color-primary)]">
                <span class="material-symbols-outlined text-[32px] font-bold">spellcheck</span>
            </div>
            <nav class="flex flex-row md:flex-col gap-2 md:gap-4 flex-1 md:w-full md:px-2">
                <button onclick="switchView('home')" id="nav-home"
                    class="md-nav-item active flex flex-col items-center gap-1 group md:w-full text-center outline-none px-3 md:px-0">
                    <div class="md-icon-wrapper md-ripple w-14 h-8 flex items-center justify-center rounded-full"><span
                            class="material-symbols-outlined">home</span></div>
                    <span class="text-[10px] md:text-xs font-medium tracking-wider">首页</span>
                </button>
                <button onclick="switchView('today')" id="nav-today"
                    class="md-nav-item flex flex-col items-center gap-1 group md:w-full text-center outline-none px-3 md:px-0">
                    <div class="md-icon-wrapper md-ripple w-14 h-8 flex items-center justify-center rounded-full"><span
                            class="material-symbols-outlined">today</span></div>

        function createRipple(e, targetEl) {
            const button = targetEl || e.currentTarget;
            if (!button || typeof button.getBoundingClientRect !== 'function') return;

            const rect = button.getBoundingClientRect();
            const circle = document.createElement("span");
            const diameter = Math.max(rect.width, rect.height);
            const radius = diameter / 2;

            const clientX = e.clientX || (e.touches && e.touches[0].clientX) || (rect.left + radius);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY) || (rect.top + radius);

            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${clientX - rect.left - radius}px`;
            circle.style.top = `${clientY - rect.top - radius}px`;
            circle.classList.add("md-ripple-ink");

            const existing = button.getElementsByClassName("md-ripple-ink")[0];
            if (existing) existing.remove();

            button.appendChild(circle);
            setTimeout(() => circle.remove(), 600);
        }

        function formatTextWithLinks(text) {
            if (!text) return '';
            const urlPattern = /(https?:\/\/[^\s]+)/g;
            const escaped = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            const withLinks = escaped.replace(urlPattern, '<a href="$1" target="_blank" rel="noopener noreferrer" class="text-[var(--md-sys-color-primary)] font-semibold underline underline-offset-2 hover:opacity-80 break-all" onclick="event.stopPropagation()">$1</a>');
            return withLinks.replace(/\n/g, '<br>');
        }

        async function loadStateFromSupabase() {
            let parsed = null;

                const {data, error} = await supabaseClient.storage.from(BUCKET_NAME).download(FILE_NAME);

                const text = await data.text();
                parsed = JSON.parse(text);
                localStorage.setItem("MD3_ATOMIC_SYSTEM_DATA", JSON.stringify(parsed));
            } catch (err) {
                const cached = localStorage.getItem("MD3_ATOMIC_SYSTEM_DATA");
                if (cached) {
                    try {parsed = JSON.parse(cached);} catch (e) { }
                }
            }

            if (!parsed || !Array.isArray(parsed.batches)) {
                parsed = JSON.parse(JSON.stringify(defaultInitialState));
            }

            // 确保每个 batch 的 subtasks 和 tags 都是合法的数组
            parsed.batches.forEach(b => {
                if (!Array.isArray(b.subtasks)) b.subtasks = [];
                if (!Array.isArray(b.tags)) b.tags = [];
            });
            if (!Array.isArray(parsed.subjects)) parsed.subjects = defaultInitialState.subjects;
            if (!Array.isArray(parsed.tags)) parsed.tags = defaultInitialState.tags;

            return parsed;
        }

        function commitState() {

            historyStack.push(JSON.parse(JSON.stringify(appState)));
            if (historyStack.length > 50) historyStack.shift();
            else historyIndex++;
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--; isRestoring = true;
                appState = JSON.parse(JSON.stringify(historyStack[historyIndex]));
                saveStateToStorage(false); renderAllComponents(); isRestoring = false;
            }
        }

        function redo() {
            if (historyIndex < historyStack.length - 1) {
                historyIndex++; isRestoring = true;

                saveStateToStorage(false); renderAllComponents(); isRestoring = false;

        function clampModalPosition(modal, x, y) {
            const pad = 12;
            const width = modal.offsetWidth || 300;
            const height = modal.offsetHeight || 260;
            const maxLeft = Math.max(pad, window.innerWidth - width - pad);
            const maxTop = Math.max(pad, window.innerHeight - height - pad);
            return {
                x: Math.min(Math.max(pad, x), maxLeft),
                y: Math.min(Math.max(pad, y), maxTop)
            };
        }

        function setupModalDrag() {
            const modal = document.getElementById("day-detail-modal");
            const header = document.getElementById("day-detail-header");
            let isDraggingModal = false, startX, startY, initialLeft, initialTop;
            let dragRafId = null;

            const startDrag = (e) => {
                if (e.target.closest('button') || e.target.closest('#day-detail-date-btn')) return;
                isDraggingModal = true;
                modal.style.transition = 'none';
                startX = e.clientX || (e.touches && e.touches[0].clientX);
                startY = e.clientY || (e.touches && e.touches[0].clientY);
                const rect = modal.getBoundingClientRect();
                initialLeft = rect.left;
                initialTop = rect.top;
                modal.style.transform = "none";
                modal.style.left = initialLeft + "px";
                modal.style.top = initialTop + "px";
                modal.style.margin = "0";

                document.addEventListener("mousemove", dragMove);
                document.addEventListener("touchmove", dragMove, {passive: false});
                document.addEventListener("mouseup", stopDrag);
                document.addEventListener("touchend", stopDrag);
            };

            const dragMove = (e) => {
                if (!isDraggingModal) return;
                if (e.cancelable) e.preventDefault();
                const currentX = e.clientX || (e.touches && e.touches[0].clientX);
                const currentY = e.clientY || (e.touches && e.touches[0].clientY);

                if (!dragRafId) {
                    dragRafId = requestAnimationFrame(() => {
                        const targetLeft = initialLeft + (currentX - startX);
                        const targetTop = initialTop + (currentY - startY);
                        const clamped = clampModalPosition(modal, targetLeft, targetTop);
                        modal.style.left = clamped.x + "px";
                        modal.style.top = clamped.y + "px";
                        dragRafId = null;
                    });
                }
            };

            const stopDrag = () => {
                if (!isDraggingModal) return;
                isDraggingModal = false;
                if (dragRafId) {
                    cancelAnimationFrame(dragRafId);
                    dragRafId = null;
                }
                modal.style.transition = '';
                document.removeEventListener("mousemove", dragMove);
                document.removeEventListener("touchmove", dragMove);
                document.removeEventListener("mouseup", stopDrag);
                document.removeEventListener("touchend", stopDrag);
                modal.dataset.moved = "true";
            };

            header.addEventListener("mousedown", startDrag);
            header.addEventListener("touchstart", startDrag, {passive: false});
        }

                    <div class="flex justify-between items-center px-1 pt-0.5 md:pt-1 flex-shrink-0 pointer-events-none">
                        <span class="text-[10px] text-[var(--md-sys-color-outline)] font-bold">周${wdStr}</span>
                        <span class="w-auto px-1.5 h-5 md:h-6 rounded-full flex items-center justify-center font-bold text-[10px] md:text-[11px] ${isToday ? 'bg-[var(--md-sys-color-primary)] text-[var(--md-sys-color-on-primary)] shadow-md' : 'text-[var(--md-sys-color-on-surface-variant)]'}">${monthNum}/${dayNum}</span>
                        <span class="w-1.5 h-1.5 rounded-full bg-transparent focus-dot absolute top-1.5 right-1.5 transition-colors"></span>
                    </div>
                    <div class="task-box flex flex-col gap-1 px-0.5 md:px-1 flex-1 overflow-y-auto md-scrollbar pb-1 pointer-events-auto"></div>`;

                monthFrag.appendChild(mCell);
                weekFrag.appendChild(wCell);

                ioMonth.observe(mCell);
                ioWeek.observe(wCell);

                monthCellMap.set(dateStr, {cell: mCell, taskBox: mCell.querySelector('.task-box'), dot: mCell.querySelector('.focus-dot')});
                weekCellMap.set(dateStr, {cell: wCell, taskBox: wCell.querySelector('.task-box'), dot: wCell.querySelector('.focus-dot')});

                currDate.setDate(currDate.getDate() + 1);
            }

            monthGrid.appendChild(monthFrag);
            weekGrid.appendChild(weekFrag);
            isCalendarGridGenerated = true;
        }

        function isSubtaskMatchingCalendarFilter(batch, subtask) {
            const typeFilter = appState.calendarFilterType || 'ALL';
            const statusFilter = appState.calendarFilterStatus || 'ALL';

            if (typeFilter !== 'ALL' && batch.subject !== typeFilter) return false;
            if (statusFilter === 'TODO' && subtask.done) return false;
            if (statusFilter === 'DONE' && !subtask.done) return false;
            return true;
        }

        function openCalendarTypeMenu(event) {
            event.stopPropagation();
            const btn = document.getElementById("btn-calendar-filter-type");
            const menu = document.getElementById("calendar-filter-menu");
            const rect = btn.getBoundingClientRect();

            let html = `
                <button onclick="setCalendarTypeFilter('ALL')" class="w-full text-left px-3 py-2 rounded-xl hover:bg-black/5 dark:hover:bg-white/5 ${appState.calendarFilterType === 'ALL' ? 'text-[var(--md-sys-color-primary)] font-bold bg-[var(--md-sys-color-secondary-container)]' : 'text-[var(--md-sys-color-on-surface)]'} transition-colors md-ripple">全部类型</button>
            `;
            appState.subjects.forEach(sub => {
                const isSel = appState.calendarFilterType === sub;
                html += `<button onclick="setCalendarTypeFilter('${sub}')" class="w-full text-left px-3 py-2 rounded-xl hover:bg-black/5 dark:hover:bg-white/5 ${isSel ? 'text-[var(--md-sys-color-primary)] font-bold bg-[var(--md-sys-color-secondary-container)]' : 'text-[var(--md-sys-color-on-surface)]'} transition-colors md-ripple">${sub}</button>`;
            });

            menu.innerHTML = html;
            menu.style.display = "flex";
            menu.style.left = `${rect.left}px`;
            menu.style.top = `${rect.bottom + 6}px`;
        }

        function setCalendarTypeFilter(typeVal) {
            appState.calendarFilterType = typeVal;
            document.getElementById("calendar-filter-menu").style.display = "none";
            document.getElementById("calendar-type-label").innerText = typeVal === 'ALL' ? '全部类型' : typeVal;
            saveStateToStorage(false);
            updateCalendarTaskRendering();
            if (appState.calendarMode === 'week') focusDayTimeline(appState.focusedDate);
        }

        function openCalendarStatusMenu(event) {
            event.stopPropagation();
            const btn = document.getElementById("btn-calendar-filter-status");
            const menu = document.getElementById("calendar-filter-menu");
            const rect = btn.getBoundingClientRect();

            const current = appState.calendarFilterStatus || 'ALL';
            const statusMap = {'ALL': '全部状态', 'TODO': '未完成', 'DONE': '已完成'};
            let html = '';
            ['ALL', 'TODO', 'DONE'].forEach(st => {
                const isSel = current === st;
                html += `<button onclick="setCalendarStatusFilter('${st}')" class="w-full text-left px-3 py-2 rounded-xl hover:bg-black/5 dark:hover:bg-white/5 ${isSel ? 'text-[var(--md-sys-color-primary)] font-bold bg-[var(--md-sys-color-secondary-container)]' : 'text-[var(--md-sys-color-on-surface)]'} transition-colors md-ripple">${statusMap[st]}</button>`;
            });

            menu.innerHTML = html;
            menu.style.display = "flex";
            menu.style.left = `${rect.left}px`;
            menu.style.top = `${rect.bottom + 6}px`;
        }

        function setCalendarStatusFilter(statusVal) {
            appState.calendarFilterStatus = statusVal;
            document.getElementById("calendar-filter-menu").style.display = "none";
            const statusMap = {'ALL': '全部状态', 'TODO': '未完成', 'DONE': '已完成'};
            document.getElementById("calendar-status-label").innerText = statusMap[statusVal];
            saveStateToStorage(false);
            updateCalendarTaskRendering();
            if (appState.calendarMode === 'week') focusDayTimeline(appState.focusedDate);
        }

        function renderCalendarFilterLabels() {
            const typeLabel = document.getElementById("calendar-type-label");
            if (typeLabel) typeLabel.innerText = appState.calendarFilterType === 'ALL' ? '全部类型' : appState.calendarFilterType;

            const statusLabel = document.getElementById("calendar-status-label");
            const statusMap = {'ALL': '全部状态', 'TODO': '未完成', 'DONE': '已完成'};
            if (statusLabel) statusLabel.innerText = statusMap[appState.calendarFilterStatus || 'ALL'];
        }

        function updateCalendarTaskRendering() {
            if (!isCalendarGridGenerated) return;

            if (previousFocusedDate) {
                const pm = monthCellMap.get(previousFocusedDate);
                if (pm) pm.cell.classList.remove('bg-[var(--md-sys-color-secondary-container)]/40', 'shadow-inner', 'focused-cell-bg');
                const pw = weekCellMap.get(previousFocusedDate);
                if (pw) {
                    pw.cell.classList.remove('bg-[var(--md-sys-color-secondary-container)]/40', 'shadow-inner', 'focused-cell-bg', 'week-cell-active');
                    pw.cell.classList.add('week-cell-inactive');
                    if (pw.dot) {pw.dot.classList.remove('bg-[var(--md-sys-color-primary)]'); pw.dot.classList.add('bg-transparent');}
                }
            }

            if (appState.focusedDate) {
                const m = monthCellMap.get(appState.focusedDate);
                if (m && appState.calendarMode === 'week') m.cell.classList.add('bg-[var(--md-sys-color-secondary-container)]/40', 'shadow-inner', 'focused-cell-bg');
                const w = weekCellMap.get(appState.focusedDate);
                if (w) {
                    w.cell.classList.add('bg-[var(--md-sys-color-secondary-container)]/40', 'shadow-inner', 'focused-cell-bg', 'week-cell-active');
                    w.cell.classList.remove('week-cell-inactive');
                    if (w.dot) {w.dot.classList.remove('bg-transparent'); w.dot.classList.add('bg-[var(--md-sys-color-primary)]');}
                }
                previousFocusedDate = appState.focusedDate;
            }

            dailyTasksHtmlCache = {};
            appState.batches.forEach(batch => {
                batch.subtasks.forEach(subtask => {
                    if (subtask.endDate) {
                        if (!isSubtaskMatchingCalendarFilter(batch, subtask)) return;

                        if (!dailyTasksHtmlCache[subtask.endDate]) dailyTasksHtmlCache[subtask.endDate] = '';
                        const starredHighlight = subtask.starred ? 'starred-calendar-item font-black ring-1 ring-amber-400' : '';
                        const starIcon = subtask.starred ? '<span class="material-symbols-outlined star-filled text-[12px] flex-shrink-0">grade</span>' : '';
                        const bgColor = subjectColors[batch.subject]?.text || "#6750A4";
                        const doneClass = subtask.done ? 'opacity-50 line-through saturate-50' : '';

                        dailyTasksHtmlCache[subtask.endDate] += `<div id="cal-sub-${subtask.id}" class="cal-task-item text-[8px] md:text-[9px] px-1.5 py-0.5 md:py-1 rounded truncate font-bold text-white shadow-sm cursor-grab hover:brightness-110 active:scale-95 transition-all flex items-center justify-between gap-0.5 ${starredHighlight} ${doneClass}" style="background-color: ${bgColor}; min-height: 20px; flex-shrink: 0;" draggable="true" data-subtask-id="${subtask.id}" data-batch-id="${batch.id}">
                            <div class="flex items-center gap-0.5 truncate flex-1 min-w-0 pointer-events-none">
                                ${starIcon}<span class="truncate">${subtask.text}</span>
                            </div>
                            <button type="button" data-context-btn="true" onclick="handleContextMenu(event, 'task_calendar', '${batch.id}', '${subtask.id}')" class="flex md:hidden hover:bg-white/20 rounded p-0.5 transition-colors flex-shrink-0">
                                <span class="material-symbols-outlined text-[13px]">more_horiz</span>
                            </button>
                        </div>`;
                    }
                });
            });

            for (const dateStr of visibleMonthCells) {
                const m = monthCellMap.get(dateStr);
                if (m) m.taskBox.innerHTML = dailyTasksHtmlCache[dateStr] || '';
            }
            for (const dateStr of visibleWeekCells) {
                const w = weekCellMap.get(dateStr);
                if (w) w.taskBox.innerHTML = dailyTasksHtmlCache[dateStr] || '';
            }

            const modal = document.getElementById("day-detail-modal");
            if (modal && modal.style.display === "flex" && !modal.classList.contains("opacity-0")) {
                const activeDate = document.getElementById("day-detail-date-title").innerText;
                if (activeDate) {
                    renderDayDetailModalContent(activeDate);
                }
            }
        }

        function clearDragHover() {
            if (currentDragHoverCell) {
                currentDragHoverCell.classList.remove('drag-hover');
                currentDragHoverCell = null;
            }
        }

        function setupCalendarDelegation() {
            const monthGrid = document.getElementById("calendar-month-scroll");
            const weekGrid = document.getElementById("calendar-week-scroll");

            [monthGrid, weekGrid].forEach(container => {
                container.addEventListener("dragenter", (e) => {
                    const cell = e.target.closest('.cell-target');
                    if (cell && currentDragHoverCell !== cell) {
                        clearDragHover();
                        cell.classList.add("drag-hover");
                        currentDragHoverCell = cell;
                    }
                });
                container.addEventListener("dragover", (e) => {
                    e.preventDefault();
                    handleAutoScroll(e, container, container.id === "calendar-month-scroll");
                });
                container.addEventListener("dragleave", (e) => {
                    const cell = e.target.closest('.cell-target');
                    if (cell && e.relatedTarget && !cell.contains(e.relatedTarget)) {
                        clearDragHover();
                    }
                });
                container.addEventListener("drop", (e) => {
                    e.preventDefault();
                    stopAutoScroll();
                    const cell = e.target.closest('.cell-target');
                    if (cell) {
                        clearDragHover();
                        dropToCalendarCell(e, cell.getAttribute("data-date"), cell);
                    }
                });

                container.addEventListener("click", (e) => {
                    if (appState.currentView !== 'calendar') return;
                    const taskEl = e.target.closest('.cal-task-item');
                    if (taskEl) return;
                    const cell = e.target.closest('.cell-target');
                    if (cell) {
                        appState.focusedDate = cell.getAttribute("data-date");
                        if (appState.calendarMode === 'month') {
                            openDayDetailModal(appState.focusedDate, e);
                        } else {
                            focusDayTimeline(appState.focusedDate);
                            scrollToDate(appState.focusedDate, 'week');
                        }
                        updateCalendarTaskRendering();
                    }
                });
            });

            document.addEventListener("dragstart", (e) => {
                const taskItem = e.target.closest('.cal-task-item');
                if (taskItem) handleSubtaskDragStart(e, taskItem.dataset.subtaskId);
            });

            document.addEventListener("click", (e) => {
                const taskEl = e.target.closest('.cal-task-item');
                if (taskEl && !e.target.closest('button')) {
                    e.stopPropagation();
                    expandToDrawerTask(taskEl.dataset.subtaskId);
                }
            });

            document.addEventListener("contextmenu", (e) => {
                const taskItem = e.target.closest('.cal-task-item');
                if (taskItem) {e.preventDefault(); handleContextMenu(e, 'task_calendar', taskItem.dataset.batchId, taskItem.dataset.subtaskId);}
            });

            document.addEventListener("mousemove", (e) => {
                const taskItem = e.target.closest('.cal-task-item');
                if (taskItem) showGlobalTooltip(e, taskItem.dataset.subtaskId);
                else hideGlobalTooltip();
            });
        }

        function renderDayDetailModalContent(dateStr) {
            const container = document.getElementById('day-detail-tasks');
            if (!container) return;

            let tasksForDay = [];
            appState.batches.forEach(b => {
                b.subtasks.forEach(s => {
                    if (s.endDate === dateStr) {
                        if (!isSubtaskMatchingCalendarFilter(b, s)) return;
                        tasksForDay.push({batch: b, subtask: s});
                    }
                });
            });

            if (tasksForDay.length === 0) {
                container.innerHTML = '<div class="text-xs text-[var(--md-sys-color-outline)] text-center py-6">此日期暂无排程任务</div>';
            } else {
                container.innerHTML = tasksForDay.map(item => {
                    const {batch, subtask} = item;
                    const bgColor = subjectColors[batch.subject]?.text || "var(--md-sys-color-primary)";
                    const isToday = subtask.endDate === TODAY_STR;
                    const doneClass = subtask.done ? 'opacity-50 line-through saturate-50' : '';
                    const starIcon = subtask.starred ? '<span class="material-symbols-outlined star-filled text-xs flex-shrink-0">grade</span>' : '';

                    return `
                    <div id="modal-sub-${subtask.id}" 
                         class="cal-task-item p-2.5 rounded-2xl text-xs font-bold text-white shadow-sm cursor-grab active:cursor-grabbing hover:brightness-110 transition-all flex items-center justify-between gap-2 ${doneClass}" 
                         style="background-color: ${bgColor};" 
                         draggable="true" 
                         ondragstart="handleSubtaskDragStart(event, '${subtask.id}')"
                         data-subtask-id="${subtask.id}" 
                         data-batch-id="${batch.id}">
                        <div class="flex items-center gap-1.5 min-w-0 flex-1 pointer-events-none">
                            ${starIcon}
                            <span class="truncate">${subtask.text}</span>
                        </div>
                        <div class="flex items-center gap-1 flex-shrink-0">
                            ${!isToday ? `<button type="button" onclick="setSubtaskToday('${subtask.id}', event)" class="px-2 py-0.5 rounded-full bg-white/20 hover:bg-white/30 text-[10px] font-bold text-white transition-colors md-ripple" title="设为今日任务">设为今日</button>` : '<span class="text-[9px] bg-white/20 px-2 py-0.5 rounded-full text-white font-mono">今日</span>'}
                            <button type="button" data-context-btn="true" onclick="handleContextMenu(event, 'task_calendar', '${batch.id}', '${subtask.id}')" class="flex md:hidden p-1 rounded hover:bg-white/20 text-white transition-colors">
                                <span class="material-symbols-outlined text-[15px]">more_horiz</span>
                            </button>
                        </div>
                    </div>`;
                }).join('');
            }
        }

        function openDayDetailDatePicker(event) {
            if (event) {
                event.stopPropagation();
                lastClickX = event.clientX || (event.touches && event.touches[0].clientX) || lastClickX;
                lastClickY = event.clientY || (event.touches && event.touches[0].clientY) || lastClickY;
            }
            const currentTitle = document.getElementById('day-detail-date-title').innerText || TODAY_STR;
            datePickerTargetType = 'dayModal';
            activeDateTriggerEl = document.getElementById('day-detail-date-btn');
            md3PickerSelectedDate = currentTitle;
            const parts = currentTitle.split('-');
            md3PickerYear = parseInt(parts[0]) || parseInt(TODAY_STR.split('-')[0]);
            md3PickerMonth = parseInt(parts[1]) || parseInt(TODAY_STR.split('-')[1]);

            renderMD3DatePicker();
            const pickerEl = document.getElementById('md3-datepicker-modal');
            let anchorX = lastClickX, anchorY = lastClickY;
            if (activeDateTriggerEl) {
                const rect = activeDateTriggerEl.getBoundingClientRect();
                anchorX = rect.left;
                anchorY = rect.bottom + 6;
            }
            pickerEl.style.display = 'flex';
            pickerEl.style.position = 'fixed';
            const width = 300, height = 340;
            if (anchorX + width > window.innerWidth - 12) anchorX = window.innerWidth - width - 12;
            if (anchorX < 12) anchorX = 12;
            if (anchorY + height > window.innerHeight - 12) anchorY = Math.max(12, anchorY - height - 40);
            if (anchorY < 12) anchorY = 12;
            pickerEl.style.left = `${anchorX}px`;
            pickerEl.style.top = `${anchorY}px`;
            requestAnimationFrame(() => {
                pickerEl.classList.remove('opacity-0', 'scale-95');
                pickerEl.classList.add('opacity-100', 'scale-100');
            });
        }

        function openDayDetailModal(dateStr, e) {
            if (appState.currentView !== 'calendar') return;
            const modal = document.getElementById('day-detail-modal');
            document.getElementById('day-detail-date-title').innerText = dateStr;

            renderDayDetailModalContent(dateStr);

            modal.style.display = "flex";

            if (!modal.dataset.moved) {
                let x = e ? (e.clientX || (e.touches && e.touches[0].clientX) || window.innerWidth / 2 - 150) : window.innerWidth / 2 - 150;
                let y = e ? (e.clientY || (e.touches && e.touches[0].clientY) || window.innerHeight / 2 - 130) : window.innerHeight / 2 - 130;

                const clamped = clampModalPosition(modal, x, y);
                modal.style.left = `${clamped.x}px`;
                modal.style.top = `${clamped.y}px`;
                modal.style.transform = "none";
            } else {
                const rect = modal.getBoundingClientRect();
                const clamped = clampModalPosition(modal, rect.left, rect.top);
                modal.style.left = `${clamped.x}px`;
                modal.style.top = `${clamped.y}px`;
            }

            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0', 'scale-95');
                modal.classList.add('opacity-100', 'scale-100');
            });
        }

        function closeDayDetailModal() {
            const modal = document.getElementById('day-detail-modal');
            if (!modal || modal.style.display === "none") return;
            modal.classList.remove('opacity-100', 'scale-100');
            modal.classList.add('opacity-0', 'scale-95');
            setTimeout(() => {modal.style.display = "none";}, 200);
        }

        function navigateDayDetailModal(delta) {
            const currentTitle = document.getElementById('day-detail-date-title').innerText;
            if (!currentTitle) return;
            const newDateStr = getAdjacentDateStr(currentTitle, delta);
            document.getElementById('day-detail-date-title').innerText = newDateStr;
            appState.focusedDate = newDateStr;
            renderDayDetailModalContent(newDateStr);
            updateCalendarTaskRendering();
        }

        function setSubtaskToday(subtaskId, event) {
            if (event) event.stopPropagation();
            const target = findSubtask(subtaskId);
            if (target) {
                target.subtask.endDate = TODAY_STR;
                saveStateToStorage();
                renderAllComponents();
                const activeDate = document.getElementById("day-detail-date-title").innerText;
                if (activeDate) renderDayDetailModalContent(activeDate);
            }
        }

        function stopAutoScroll() {
            if (calScrollInterval) {
                clearInterval(calScrollInterval);
                calScrollInterval = null;
            }
        }

        function handleCalendarScroll(e, isVertical) {
            if (isScrollTicking) return;
            isScrollTicking = true;
            requestAnimationFrame(() => {
                isScrollTicking = false;
                const container = e.target;
                if (isVertical) {
                    const grid = document.getElementById("month-grid-container");
                    if (!grid || !grid.firstElementChild) return;
                    const cellHeight = grid.firstElementChild.offsetHeight || 65;
                    const rowIndex = Math.floor((container.scrollTop + 40) / cellHeight);
                    const dayOffset = rowIndex * 7;
                    const refDate = new Date(calendarBaseStartDate.getTime() + dayOffset * 86400000);
                    if (!isNaN(refDate.getTime())) {
                        const y = refDate.getFullYear();
                        const m = refDate.getMonth() + 1;
                        if (appState.calendarYear !== y || appState.calendarMonth !== m) {
                            appState.calendarYear = y;
                            appState.calendarMonth = m;
                            document.getElementById("calendar-month-title").innerText = `${y}年 ${m}月`;
                        }
                    }
                } else {
                    const grid = document.getElementById("week-grid-container");
                    if (!grid || !grid.firstElementChild) return;
                    const cellWidth = grid.firstElementChild.offsetWidth || 70;
                    const colIndex = Math.floor((container.scrollLeft + cellWidth / 2) / cellWidth);
                    const refDate = new Date(calendarBaseStartDate.getTime() + colIndex * 86400000);
                    if (!isNaN(refDate.getTime())) {
                        const y = refDate.getFullYear();
                        const m = refDate.getMonth() + 1;
                        if (appState.calendarYear !== y || appState.calendarMonth !== m) {
                            appState.calendarYear = y;
                            appState.calendarMonth = m;
                            document.getElementById("calendar-month-title").innerText = `${y}年 ${m}月`;
                        }
                    }
                }
            });
        }

        function scrollToDate(dateStr, mode) {
            if (!dateStr) return;
            const container = mode === 'month' ? document.getElementById('calendar-month-scroll') : document.getElementById('calendar-week-scroll');
            const cellObj = mode === 'month' ? monthCellMap.get(dateStr) : weekCellMap.get(dateStr);
            const targetCell = cellObj?.cell;

            if (targetCell && container) {
                if (mode === 'month') {
                    const offset = targetCell.offsetTop - container.clientHeight / 2 + targetCell.clientHeight / 2;
                    container.scrollTo({top: offset, behavior: 'smooth'});
                } else {
                    const offset = targetCell.offsetLeft - container.clientWidth / 2 + targetCell.clientWidth / 2;
                    container.scrollTo({left: offset, behavior: 'smooth'});
                }
                const parts = dateStr.split('-');
                document.getElementById("calendar-month-title").innerText = `${parts[0]}年 ${parseInt(parts[1])}月`;
            }
        }

        function findSubtask(subtaskId) {
            for (let b of appState.batches) {
                let s = b.subtasks.find(x => x.id === subtaskId);
                if (s) return {batch: b, subtask: s};
            }
            return null;
        }

        function toggleSubtaskStar(subtaskId, event, btnEl) {
            if (event) event.stopPropagation();
            const target = findSubtask(subtaskId);
            if (target) {
                target.subtask.starred = !target.subtask.starred;
                if (btnEl) {
                    const icon = btnEl.querySelector('.material-symbols-outlined') || btnEl;
                    icon.classList.add('star-pop'); setTimeout(() => icon.classList.remove('star-pop'), 400);
                }
                saveStateToStorage(); renderAllComponents();
            }
        }

        function expandToDrawerTask(subId, query = '') {
            if (query) document.getElementById('drawer-search-input').value = query;
            locateDrawerSearchResult(subId, query);
        }

        function openDateQuickMenu(subtaskId, event) {
            if (event) {
                event.stopPropagation();
                lastClickX = event.clientX || (event.touches && event.touches[0].clientX) || lastClickX;
                lastClickY = event.clientY || (event.touches && event.touches[0].clientY) || lastClickY;
            }
            currentDateActionSubtaskId = subtaskId;
            datePickerTargetType = 'task';
            activeDateTriggerEl = event ? event.currentTarget : null;
            const target = findSubtask(subtaskId);
            const hasDate = target && !!target.subtask.endDate;

            const customLabel = document.getElementById('date-quick-menu-custom-label');
            if (customLabel) {
                customLabel.innerText = hasDate ? '更改日期' : '设置日期';
            }

            const menu = document.getElementById('date-quick-menu');
            let x = lastClickX, y = lastClickY;
            if (activeDateTriggerEl) {
                const rect = activeDateTriggerEl.getBoundingClientRect();
                x = rect.left;
                y = rect.bottom + 6;
            }
            menu.style.display = "flex";
            const width = 150, height = 90;
            if (x + width > window.innerWidth - 12) x = window.innerWidth - width - 12;
            if (y + height > window.innerHeight - 12) y = Math.max(12, y - height - 30);
            menu.style.left = `${x}px`; menu.style.top = `${y}px`;
        }

        function executeDateAction(type) {
            const subId = currentDateActionSubtaskId;
            document.getElementById('date-quick-menu').style.display = "none";
            if (!subId) return;
            if (type === 'today') {
                const target = findSubtask(subId);
                if (target) {target.subtask.endDate = TODAY_STR; saveStateToStorage(); renderAllComponents();}
            } else if (type === 'custom') {
                setTimeout(() => openMD3DatePicker(subId), 10);
            }
        }

        function openMD3DatePicker(subtaskId, event) {
            if (event) {
                event.stopPropagation();
                lastClickX = event.clientX || (event.touches && event.touches[0].clientX) || lastClickX;
                lastClickY = event.clientY || (event.touches && event.touches[0].clientY) || lastClickY;
            }
            currentDateActionSubtaskId = subtaskId;

            const selParts = md3PickerSelectedDate.split('-');
            document.getElementById('md3-picker-header-date').innerText = `${selParts[0]}年${parseInt(selParts[1])}月${parseInt(selParts[2])}日`;
            const grid = document.getElementById('md3-picker-days-grid');

            const totalDays = new Date(md3PickerYear, md3PickerMonth, 0).getDate();
            for (let i = 0; i < firstDay; i++) grid.insertAdjacentHTML('beforeend', `<div></div>`);

                const dateStr = `${md3PickerYear}-${String(md3PickerMonth).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isSelected = dateStr === md3PickerSelectedDate;

            timelineInteractionCtx.initialY = e.clientY || (e.touches && e.touches[0].clientY);
            const target = findSubtask(subtaskId);
            timelineInteractionCtx.initialStartMinute = target.subtask.startMinute;
            isGlobalDragging = true; hideGlobalTooltip();
            window.addEventListener("mousemove", doTimelineResizeOrDrag); window.addEventListener("mouseup", stopTimelineResizeOrDrag);

        }

        function startTimelineResize(e, subtaskId) {
            e.stopPropagation(); if (e.type !== 'touchstart') e.preventDefault();
            timelineInteractionCtx.type = 'resize'; timelineInteractionCtx.subtaskId = subtaskId;
            timelineInteractionCtx.initialY = e.clientY || (e.touches && e.touches[0].clientY);
            const target = findSubtask(subtaskId);
            timelineInteractionCtx.initialDuration = target.subtask.durationMinutes;
            isGlobalDragging = true; hideGlobalTooltip();
            window.addEventListener("mousemove", doTimelineResizeOrDrag); window.addEventListener("mouseup", stopTimelineResizeOrDrag);
            window.addEventListener("touchmove", doTimelineResizeOrDrag, {passive: false}); window.addEventListener("touchend", stopTimelineResizeOrDrag);
        }

        function doTimelineResizeOrDrag(e) {
            if (!timelineInteractionCtx.type) return;
            if (e.type === 'touchmove') e.preventDefault();
            const currentY = e.clientY || (e.touches && e.touches[0].clientY);
            const deltaY = currentY - timelineInteractionCtx.initialY;
            const minuteDelta = Math.round(deltaY / 10) * 10;
            const target = findSubtask(timelineInteractionCtx.subtaskId);
            if (!target) return;
            if (timelineInteractionCtx.type === 'resize') {
                let newDur = timelineInteractionCtx.initialDuration + minuteDelta;
                target.subtask.durationMinutes = Math.max(10, Math.min(1440 - target.subtask.startMinute, newDur));
            } else if (timelineInteractionCtx.type === 'drag') {
                let newStart = timelineInteractionCtx.initialStartMinute + minuteDelta;
                target.subtask.startMinute = Math.max(0, Math.min(1440 - target.subtask.durationMinutes, newStart));
            }
            focusDayTimeline(appState.focusedDate);
        }

        function executeContextMenuAction(action) {
            const {type, arg1, arg2, arg3} = contextMenuCtx;
            if (action === 'toggle_star') {toggleSubtaskStar(arg2);}

                const subId = arg2;
                document.getElementById("custom-context-menu").style.display = "none";

            else if (action === 'delete_main') {appState.batches = appState.batches.filter(b => b.id !== arg1); saveStateToStorage(); renderAllComponents();}
            else if (action === 'add_subject_task') {openAddTaskModal(); selectFormSubject(arg1);}
            else if (action === 'delete_subject') {appState.subjects = appState.subjects.filter(s => s !== arg1); saveStateToStorage(); renderAllComponents();}
